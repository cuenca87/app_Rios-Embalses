// Cuenca vertiente en un punto. opts: { tramo, titulo, mantenerMapa }
async function calcularCuencaPunto(lon, lat, opts = {}) {
    const btn = document.getElementById("btn-cuenca-punto");
    if (opts.mantenerMapa) quitarCapaCuenca(); else clearMap();
    btn.disabled = true;
    const cab = opts.titulo ? `<span class="r-name">${escapeHtml(opts.titulo)}</span>\n` : "";
    (opts.mantenerMapa ? addResult : setResult)(`${opts.mantenerMapa ? "\n\n" : ""}<span class="r-label">Calculando cuenca vertiente...</span>`);
    const box = document.getElementById("result-box"), inicio = box.innerHTML.lastIndexOf('<span class="r-label">Calculando cuenca vertiente');
    const pintar = h => { box.innerHTML = box.innerHTML.slice(0, inicio) + h; };
    try {
        showProgress(5, "Buscando el cauce mas cercano...");
        let tramo = opts.tramo, distKm = 0;
        if (!tramo) {
            const t = await tramoMasCercano(lon, lat);
            if (!t) { pintar(`<span class="r-info">No hay ningun cauce de la red de MITECO a menos de 600 m del punto. Pulse mas cerca de un rio.</span>`); return; }
            tramo = t.tramo; distKm = t.distKm;
        }
        const U = tramo.properties.cod_pfafcuen, rioU = tramo.properties.cod_pfafrio;
        showProgress(15, "Buscando las subcuencas aguas arriba...");
        const cqlArriba = pfafCqlAguasArriba(U, rioU, true);
        const [propias, rango] = await Promise.all([
            wfsUnidades(`cod_pfafcuen = '${U}'`, true),
            unidadesAguasArriba(U, rioU)
        ]);
        const arriba = rango.filter(f => !esCuencaCerrada(f.properties.cod_pfafcuen, rioU));
        const cerradas = rango.filter(f => esCuencaCerrada(f.properties.cod_pfafcuen, rioU));
        const propia = propias[0];
        if (!propia) throw new Error(`no se encontro la subcuenca del tramo ${U}`);

        // Tramo propio: hasta el punto con el MDT, o entero si no se puede
        let corte = null, avisoMdt = "";
        if (document.getElementById("chk-cuenca-mdt").checked) {
            showProgress(35, "Cortando el tramo en el punto con el MDT del IGN...");
            try { corte = await cortarTramoConMdt(propia, tramo, lon, lat); }
            catch (e) { avisoMdt = `No se pudo cortar el tramo con el MDT (${e.message}); se cuenta entero.`; }
        }
        const sr = resumenUnidades(arriba, rioU);
        const areaPropia = corte ? corte.areaKm2 : +propia.properties.area_ctr_km2;
        const area = sr.area + areaPropia;
        const punto = corte ? corte.punto : turf.nearestPointOnLine(lineasDe(tramo)[0], turf.point([lon, lat])).geometry.coordinates;

        showProgress(60, "Dibujando la cuenca...");
        let geom = null, notaGeom = "";
        const partePropia = corte?.poligono || propia;
        if (!arriba.length) geom = turf.feature(partePropia.geometry);
        else if (arriba.length <= CUENCA_GEOM_MAX) {
            const conGeom = await wfsUnidades(cqlArriba, true);
            showProgress(80, `Uniendo ${conGeom.length} subcuencas...`);
            await new Promise(r => setTimeout(r, 30));
            geom = disolver(conGeom.map(f => turf.feature(f.geometry)).concat([turf.feature(partePropia.geometry)]));
        } else {
            showProgress(75, `Contorno de ${sr.n.toLocaleString("es-ES")} subcuencas...`);
            try {
                const c = await contornoPorImagen(cqlArriba, sr.bbox);
                geom = disolver([turf.feature(c.geom.geometry), turf.feature(partePropia.geometry)]);
                notaGeom = `El contorno se obtiene de una imagen de las ${sr.n.toLocaleString("es-ES")} subcuencas de MITECO con unos ${c.resM} m de pixel. La superficie se calcula con las subcuencas, no con el contorno.`;
            } catch (e) {
                mostrarWmsUnidades(cqlArriba);
                geom = null;
                notaGeom = `No se pudo obtener el contorno (${e.message}): se muestran las ${sr.n.toLocaleString("es-ES")} subcuencas con el servicio de mapas de MITECO.`;
            }
        }
        // El servicio de cotas del IGN a veces tarda >8 s: la cota es informativa, no se espera mas de 4 s
        const cotaPunto = await Promise.race([getElevation(punto[0], punto[1]), new Promise(r => setTimeout(() => r(null), 4000))]);
        const cotaMax = Math.max(sr.cotaMax ?? -Infinity, +propia.properties.cota_max || -Infinity);
        const cotaMed = (sr.sumCota + areaPropia * (+propia.properties.cota_med || 0)) / area;
        const demar = findDemarcacion(punto[0], punto[1]);
        const info = {
            rio: tramo.properties.nom_rio, cod_pfafcuen: U, area_km2: +area.toFixed(3),
            area_aguas_arriba_km2: +sr.area.toFixed(3), area_tramo_km2: +areaPropia.toFixed(3),
            n_subcuencas: sr.n + 1, cota_max_m: isFinite(cotaMax) ? cotaMax : null,
            cota_med_m: isFinite(cotaMed) && cotaMed > 0 ? Math.round(cotaMed) : null, cota_punto_m: cotaPunto,
            metodo_tramo: corte ? `MDT ${corte.celda} m IGN` : "tramo completo", lon: +punto[0].toFixed(6), lat: +punto[1].toFixed(6)
        };
        dibujarCuenca(geom, punto, tramo, info, geom ? null : sr.bbox);

        let h = cab + `<span class="r-label">Cuenca vertiente</span>
<span class="r-label">Rio:</span> ${escapeHtml(tramo.properties.nom_rio || "-")}${distKm > 0.05 ? ` <span class="r-info">(a ${(distKm * 1000).toFixed(0)} m del punto pulsado)</span>` : ""}
<span class="r-label">Punto de cierre:</span> ${punto[1].toFixed(5)}, ${punto[0].toFixed(5)}${cotaPunto != null ? ` · ${cotaPunto.toFixed(0)} m` : ""}
<span class="r-label">Demarcacion:</span> ${demar || "-"}

<span class="r-name">${fmtKm2(area)} km²</span>
<span class="r-info">  aguas arriba del tramo: ${fmtKm2(sr.area)} km² (${sr.n.toLocaleString("es-ES")} subcuencas)
  tramo hasta el punto: ${fmtKm2(areaPropia)} km² ${corte ? `(MDT ${corte.celda} m, ${(corte.fraccion * 100).toFixed(0)} % de su subcuenca)` : "(subcuenca completa del tramo)"}</span>
<span class="r-label">Cota maxima:</span> ${isFinite(cotaMax) ? cotaMax.toFixed(0) + " m" : "-"}
<span class="r-label">Cota media:</span> ${isFinite(cotaMed) && cotaMed > 0 ? cotaMed.toFixed(0) + " m" : "-"}
<span class="r-label">Codigo Pfafstetter del tramo:</span> ${U}`;
        if (sr.afluentes.length) h += `\n\n<span class="r-label">Rios principales aguas arriba:</span>` + sr.afluentes.map(r => `\n  - ${escapeHtml(r.nombre)} <span class="r-info">(${fmtKm2(r.area)} km²)</span>`).join("");
        if (cerradas.length) {
            const ac = cerradas.reduce((s, f) => s + (+f.properties.area_ctr_km2 || 0), 0);
            const nombres = [...new Set(cerradas.map(f => f.properties.nom_rio).filter(n => n && n !== "SIN NOMBRE"))].slice(0, 4);
            h += `\n\n<span class="r-info">No se cuentan ${cerradas.length} cuenca${cerradas.length > 1 ? "s" : ""} cerrada${cerradas.length > 1 ? "s" : ""} (${fmtKm2(ac)} km²) que no vierten al rio${nombres.length ? ": " + nombres.map(escapeHtml).join(", ") : ""}.</span>`;
        }
        if (avisoMdt) h += `\n\n<span style="color:#FFB74D;">${escapeHtml(avisoMdt)}</span>`;
        if (notaGeom) h += `\n\n<span class="r-info">${notaGeom}</span>`;
        h += `\n\n<span class="r-info" style="font-size:11px;">Fuente: subcuencas Pfafstetter por tramo (MITECO) y MDT 5 m (IGN).</span>`;
        if (cuencaActual) h += BOTON_LLUVIA + BOTON_FICHA;
        pintar(h);
        lluviaAutomatica();
        saihEnPanel();
        abrirFichaCuenca();
        showProgress(100, "Completado");
    } catch (e) {
        pintar(`<span style="color:#ff6b6b;">Error al calcular la cuenca: ${escapeHtml(e.message)}</span>`);
    } finally { hideProgress(); btn.disabled = false; }
}

// Cuenca completa del rio buscado (en su desembocadura)
async function cuencaRioCompleto() {
    if (!lastRiverCodPfaf) return;
    const R = lastRiverCodPfaf, btn = document.getElementById("btn-cuenca-rio");
    btn.disabled = true;
    quitarCapaCuenca();
    addResult(`\n\n<span class="r-label">Calculando cuenca vertiente del rio...</span>`);
    showProgress(10, "Descargando la cuenca del rio (MITECO)...");
    try {
        const filtro = encodeURIComponent(`cod_pfafrio = '${R}'`);
        const [resp, unidades] = await Promise.all([
            fetch(`${OGC_CUENCA_RIO}?f=json&limit=5&filter=${filtro}&filter-lang=cql-text`),
            (R.length >= grupoPfaf(R).length
                ? unidadesTablaRangos(grupoPfaf(R), [[R, R + PFAF_TOPE]])
                : Promise.reject(new Error("rio sin tabla")))
                .catch(() => wfsUnidades(`cod_pfafcuen BETWEEN '${R}' AND '${R}${PFAF_TOPE}'`, false))
        ]);
        if (!resp.ok) throw new Error(`API error: ${resp.status}`);
        const cuenca = (await resp.json()).features?.[0];
        if (!cuenca) throw new Error("MITECO no tiene la cuenca de este rio");
        showProgress(80, "Dibujando...");
        const sr = resumenUnidades(unidades, R);
        const nombre = (cuenca.properties.nom_rio || "").trim();
        const info = { rio: nombre, cod_pfafrio: R, area_km2: +sr.area.toFixed(3), n_subcuencas: sr.n, cota_max_m: sr.cotaMax,
            cota_med_m: sr.area ? Math.round(sr.sumCota / sr.area) : null };
        dibujarCuenca(turf.feature(cuenca.geometry), null, null, info);
        let h = `\n\n<span class="r-label">Cuenca vertiente en la desembocadura:</span> <span class="r-name">${fmtKm2(sr.area)} km²</span>
<span class="r-label">Cota maxima:</span> ${sr.cotaMax != null ? sr.cotaMax.toFixed(0) + " m" : "-"}
<span class="r-label">Cota media:</span> ${sr.area ? (sr.sumCota / sr.area).toFixed(0) + " m" : "-"}
<span class="r-label">Subcuencas Pfafstetter:</span> ${sr.n.toLocaleString("es-ES")}`;
        if (sr.afluentes.length) h += `\n\n<span class="r-label">Afluentes principales:</span>` + sr.afluentes.map(r => `\n  - ${escapeHtml(r.nombre)} <span class="r-info">(${fmtKm2(r.area)} km²)</span>`).join("");
        h += `\n<span class="r-info" style="font-size:11px;">Para la cuenca en un punto concreto del rio, use la pestaña 💧 Cuenca.</span>`;
        if (cuencaActual) h += BOTON_LLUVIA + BOTON_FICHA;
        const box = document.getElementById("result-box");
        box.innerHTML = box.innerHTML.replace(/\n\n<span class="r-label">Calculando cuenca vertiente del rio\.\.\.<\/span>$/, "") + h;
        lluviaAutomatica();
        saihEnPanel();
        abrirFichaCuenca();
        showProgress(100, "Completado");
    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${escapeHtml(e.message)}</span>`); }
    finally { hideProgress(); btn.disabled = false; }
}

// Cuenca vertiente de un embalse: se cierra en el tramo de rio mas aguas abajo
// que cruza el embalse, en su ultimo punto dentro del vaso (aprox. la presa).
async function cuencaEmbalse() {
    if (!lastEmbalseFeats) return;
    const btn = document.getElementById("btn-cuenca-embalse");
    btn.disabled = true;
    try {
        showProgress(5, "Buscando los cauces del embalse...");
        const b = turf.bbox(turf.featureCollection(lastEmbalseFeats));
        const cand = await fetchBbox(OGC_SUBTRAMOS, b.join(","), PAGE_LIMIT);
        const dentro = cand.filter(t => t.properties?.cod_pfafcuen && lastEmbalseFeats.some(e => { try { return turf.booleanIntersects(t, e); } catch { return false; } }));
        if (!dentro.length) { addResult(`\n\n<span class="r-info">Ningun cauce de MITECO cruza este embalse.</span>`); return; }
        let tramo = dentro[0], maxN = -1;
        for (const t of dentro) {
            const n = dentro.filter(o => pfafEstaAguasArriba(o.properties.cod_pfafcuen, t.properties.cod_pfafcuen, t.properties.cod_pfafrio)).length;
            if (n > maxN) { maxN = n; tramo = t; }
        }
        const vert = lineasDe(tramo).flatMap(l => l.geometry.coordinates)
            .filter(c => lastEmbalseFeats.some(e => { try { return turf.booleanPointInPolygon(turf.point(c), e); } catch { return false; } }));
        // Los tramos van de nacimiento a desembocadura: el ultimo vertice dentro
        // del vaso es el mas proximo a la presa (sobre el agua el MDT es plano).
        let cierre;
        if (vert.length) {
            cierre = vert[vert.length - 1];
        } else {
            cierre = turf.nearestPointOnLine(lineasDe(tramo)[0], turf.centroid(turf.featureCollection(lastEmbalseFeats))).geometry.coordinates;
        }
        const nombre = lastEmbalseFeats[0].properties?.nombre || "embalse";
        await calcularCuencaPunto(cierre[0], cierre[1], { tramo, titulo: `Cuenca vertiente de ${nombre}`, mantenerMapa: true });
    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${escapeHtml(e.message)}</span>`); }
    finally { hideProgress(); btn.disabled = false; }
}

// --- Lluvia estimada por radar (OPERA) ---
// Compuesto europeo OPERA NIMBUS de lluvia acumulada en 1 h (EUMETNET, CC BY 4.0):
// mm en celdas de 2 km (LAEA), uno nuevo cada 15 min (~12 min despues del final
// de la hora) y se guardan 24 h. Incluye 10 de los 15 radares de AEMET, ademas
// de los de Portugal y Francia. Se lee a traves del proxy, que reenvia los rangos.
// Se descargan una vez las 24 horas de la ventana de la Peninsula y Baleares
// (4 teselas del GeoTIFF, ~225 KB por hora sin lluvia) y con eso se pinta la capa
// del mapa y se calcula la lluvia de cualquier cuenca. Canarias queda fuera de OPERA.
const OPERA_PROXY = MITECO_PROXY + "opera/";
const OPERA_NODATA = -9999000;                 // sin cobertura (NaN en el GeoTIFF = hay radar y no llueve)
const LLUVIA_HORAS = 24;
// Tope de granizo: OPERA convierte toda la reflectividad en lluvia (Z-R 200/1,6) y el granizo
// o los ecos del relieve dan cifras imposibles (hasta 556 mm en una hora en la Serrania de
// Ronda, 17-oct-2026). Se limita cada hora a 100 mm, que equivale a cortar en ~55 dBZ.
const LLUVIA_TOPE_MMH = 100;
const LLUVIA_VENTANA = [90, 1550, 760, 2110];  // columnas/filas de la rejilla OPERA
const LLUVIA_SIN = 65535;                      // datos en centesimas de mm (Uint16); este valor = sin cobertura
let cuencaActual = null;   // { geom } de la ultima cuenca dibujada
let lluviaCarga = null;    // { p: Promise de los datos, t: cuando se pidieron }

const pad2 = n => String(n).padStart(2, "0");
function operaUrl(fin) {   // fin: Date (UTC) del final del acumulado
    const d = `${fin.getUTCFullYear()}${pad2(fin.getUTCMonth() + 1)}${pad2(fin.getUTCDate())}`;
    return `${OPERA_PROXY}${d.slice(0, 4)}/${d.slice(4, 6)}/${d.slice(6)}/OPERA/COMP/OPERA@${d}T${pad2(fin.getUTCHours())}${pad2(fin.getUTCMinutes())}@0@ACRR.tiff`;
}
async function abrirOpera(fin, intentos = 2) {
    for (let k = 0; k < intentos; k++) {
        try { return await (await GeoTIFF.fromUrl(operaUrl(fin), { allowFullFile: false })).getImage(); }
        catch { }   // aun no publicado, ya borrado (solo hay 24 h) o fallo de red
    }
    return null;
}
const horaLocal = d => d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

// Ultimas 24 h de lluvia (una vez; se vuelven a pedir pasados 10 min)
function cargarLluvia(progreso) {
    if (lluviaCarga && Date.now() - lluviaCarga.t < 10 * 60000) return lluviaCarga.p;
    const p = (async () => {
        await cargarLibsMdt();
        proj4.defs("OPERA", "+proj=laea +lat_0=55 +lon_0=10 +x_0=1950000 +y_0=-2100000 +ellps=WGS84 +units=m +no_defs");
        // Ultimo compuesto publicado: se prueba hacia atras de 15 en 15 min
        let fin = new Date(Math.floor((Date.now() - 10 * 60000) / 900000) * 900000), img = null;
        for (let k = 0; k < 6 && !img; k++) { img = await abrirOpera(fin, 1); if (!img) fin = new Date(fin - 900000); }
        if (!img) throw new Error("no hay compuestos de OPERA disponibles");
        const [c0, f0, c1, f1] = LLUVIA_VENTANA, W = c1 - c0, H = f1 - f0;
        // Acumulados horarios que no se solapan: fin, fin-1h, ..., fin-23h
        const fines = Array.from({ length: LLUVIA_HORAS }, (_, i) => new Date(fin - i * 3600000));
        const horas = new Array(LLUVIA_HORAS);
        let hechas = 0, sig = 0;
        const trabajador = async () => {
            while (sig < fines.length) {
                const i = sig++;
                const im = i === 0 ? img : await abrirOpera(fines[i]);
                let v = null;
                if (im) {
                    try {
                        const [r] = await im.readRasters({ window: LLUVIA_VENTANA, samples: [0] });
                        v = new Uint16Array(W * H);
                        for (let k = 0; k < v.length; k++) {
                            const x = r[k];
                            v[k] = x === OPERA_NODATA ? LLUVIA_SIN : x > 0 ? Math.round(Math.min(x, LLUVIA_TOPE_MMH) * 100) : 0;
                        }
                    } catch { v = null; }
                }
                horas[LLUVIA_HORAS - 1 - i] = { fin: fines[i], v };
                progreso?.(++hechas, LLUVIA_HORAS);
            }
        };
        await Promise.all(Array.from({ length: 6 }, trabajador));
        const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
        return { fin, horas, W, H, ox: ox + c0 * rx, oy: oy + f0 * ry, rx, ry, proj: "OPERA" };
    })();
    lluviaCarga = { p, t: Date.now() };
    p.catch(() => { lluviaCarga = null; });
    return p;
}

// Prevision de lluvia de dos modelos, que descarga y prepara el repo cuenca87/meteo
// (GitHub Actions): por cada hora, un PNG con la lluvia de esa hora en centesimas de mm
// (R = byte alto, G = byte bajo) en una rejilla en grados, y un manifiesto.
// - AROME de Meteo-France: celdas de 0,02° (~2 km), hasta 51 h, ejecucion cada 3 h. No
//   llega al sur (por debajo de ~38° N: Guadalquivir, Andalucia oriental, sur de Murcia),
//   a la punta oeste de Galicia ni a Canarias (alli las celdas vienen sin dato).
// - ICON-EU del DWD aleman: celdas de 0,0625° (~7 km), hasta 120 h, ejecucion cada 6 h,
//   toda la Peninsula y Baleares.
// Cada modelo se publica en su rama (datos-arome, datos-icon), sobrescrita en cada pasada.
// Mismo formato que el radar (horas[].v en Uint16, LLUVIA_SIN = sin dato), pero las
// horas van hacia delante (prevision: true) y la rejilla es en grados.
const MODELOS = {
    arome: {
        url: "https://raw.githubusercontent.com/cuenca87/meteo/datos-arome/png_precipitacion/", nombre: "AROME", corto: "~2 km · 2 dias",
        fuente: "modelo AROME de Meteo-France (Etalab 2.0), celdas de 2 km",
        zona: "no cubre el sur de ~38° N (Guadalquivir, Andalucia oriental, sur de Murcia), la punta oeste de Galicia ni Canarias"
    },
    icon: {
        url: "https://raw.githubusercontent.com/cuenca87/meteo/datos-icon/", nombre: "ICON-EU", corto: "~7 km · 5 dias",
        fuente: "modelo ICON-EU del DWD aleman (CC BY 4.0), celdas de 7 km",
        zona: "toda la Peninsula y Baleares; Canarias no"
    }
};
const prevCarga = {};   // modelo -> { p, t }
async function leerPngValores(url, W, H) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const bm = await createImageBitmap(await r.blob(), { colorSpaceConversion: "none", premultiplyAlpha: "none" });
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(bm, 0, 0);
    const px = cx.getImageData(0, 0, W, H).data, v = new Uint16Array(W * H);
    for (let k = 0; k < v.length; k++) v[k] = px[4 * k] << 8 | px[4 * k + 1];
    return v;
}
function cargarPrevision(mod, progreso) {
    const M = MODELOS[mod], c = prevCarga[mod];
    if (c && Date.now() - c.t < 10 * 60000) return c.p;
    const p = (async () => {
        await cargarLibsMdt();   // proj4
        const r = await fetch(M.url + "manifiesto.json", { cache: "no-cache" });
        if (!r.ok) throw new Error(`la prevision ${M.nombre} no esta disponible (${r.status})`);
        const man = await r.json(), g = man.rejillaValores;
        if (!g) throw new Error(`la prevision ${M.nombre} aun no trae los valores`);
        // Horas que terminan despues de ahora, seguidas (un hueco queda como hora sin datos)
        const ahora = Date.now(), porHora = new Map();
        for (const f of man.frames) if (f.valores && Date.parse(f.hora) > ahora) porHora.set(Date.parse(f.hora), f);
        if (!porHora.size) throw new Error(`la prevision ${M.nombre} esta caducada`);
        const t0 = Math.min(...porHora.keys()), t1 = Math.max(...porHora.keys());
        const horas = [];
        for (let t = t0; t <= t1; t += 3600000) horas.push({ fin: new Date(t), f: porHora.get(t), v: null });
        let hechas = 0, sig = 0;
        const trabajador = async () => {
            while (sig < horas.length) {
                const hh = horas[sig++];
                if (hh.f) try { hh.v = await leerPngValores(M.url + hh.f.valores, g.W, g.H); } catch { hh.v = null; }
                progreso?.(++hechas, horas.length);
            }
        };
        await Promise.all(Array.from({ length: 6 }, trabajador));
        // "2026-10-17T15.00.00Z" -> fecha de la ejecucion (la de la hora mas proxima)
        const ej = s => s ? new Date(s.replace(/T(\d\d)\.(\d\d)\.(\d\d)Z/, "T$1:$2:$3Z")) : null;
        // Desde que hora el modelo da tramos de 3 h (ICON-EU pasado +78 h), repartidos a partes iguales
        const tramos3 = horas.findIndex(hh => hh.f?.paso_h > 1);
        return {
            prevision: true, modelo: mod, proj: "EPSG:4326", clave: mod, horas, W: g.W, H: g.H, ox: g.x0, oy: g.y0, rx: g.dx, ry: -g.dy,
            ini: new Date(t0 - 3600000), fin: new Date(t1), ejecucion: ej(horas[0].f?.ejecucion || man.ejecucion), tramos3
        };
    })();
    prevCarga[mod] = { p, t: Date.now() };
    p.catch(() => { delete prevCarga[mod]; });
    return p;
}
// Horas [i0, i1) del periodo de h horas: las ultimas del radar o las primeras de la prevision
const tramoH = (d, h) => d.prevision ? [0, Math.min(h, d.horas.length)] : [d.horas.length - h, d.horas.length];
const fechaHora = d => d.toLocaleString("es-ES", { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
// Celda de la ventana que contiene un punto (o -1)
function celdaLluvia(d, lon, lat) {
    const [x, y] = proj4("EPSG:4326", d.proj, [lon, lat]);
    const c = Math.floor((x - d.ox) / d.rx), f = Math.floor((y - d.oy) / d.ry);
    return c < 0 || f < 0 || c >= d.W || f >= d.H ? -1 : f * d.W + c;
}
// Acumulado del periodo de h horas en una celda (mm; null si ninguna hora tiene cobertura)
function acumCelda(d, k, h) {
    let s = 0, ok = false;
    const [i0, i1] = tramoH(d, h);
    for (let i = i0; i < i1; i++) {
        const v = d.horas[i].v;
        if (!v || v[k] === LLUVIA_SIN) continue;
        s += v[k]; ok = true;
    }
    return ok ? s / 100 : null;
}

// Celdas cuyo centro cae dentro de la cuenca (o la que contiene el centroide,
// si la cuenca es menor que una celda)
function celdasCuenca(d, geom) {
    const [w, s, e, n] = turf.bbox(geom);
    const esq = [[w, s], [w, n], [e, s], [e, n], [(w + e) / 2, s], [(w + e) / 2, n], [w, (s + n) / 2], [e, (s + n) / 2]]
        .map(c => proj4("EPSG:4326", d.proj, c));
    const col = x => Math.floor((x - d.ox) / d.rx), fil = y => Math.floor((y - d.oy) / d.ry);
    const c0 = Math.max(0, Math.min(...esq.map(p => col(p[0]))) - 1), c1 = Math.min(d.W - 1, Math.max(...esq.map(p => col(p[0]))) + 1);
    const f0 = Math.max(0, Math.min(...esq.map(p => fil(p[1]))) - 1), f1 = Math.min(d.H - 1, Math.max(...esq.map(p => fil(p[1]))) + 1);
    if (c0 > c1 || f0 > f1) return null;
    // Para el punto-en-poligono basta un contorno simplificado (~200 m)
    const polis = (geom.type === "FeatureCollection" ? geom.features : [geom])
        .map(f => turf.simplify(turf.feature(f.geometry || f), { tolerance: 0.002, highQuality: false }));
    const dentro = [];
    for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) {
        const pt = turf.point(proj4(d.proj, "EPSG:4326", [d.ox + (c + 0.5) * d.rx, d.oy + (f + 0.5) * d.ry]));
        if (polis.some(p => turf.booleanPointInPolygon(pt, p))) dentro.push(f * d.W + c);
    }
    if (dentro.length) return { dentro, centroide: false };
    const k = celdaLluvia(d, ...turf.centroid(geom).geometry.coordinates);
    return k < 0 ? null : { dentro: [k], centroide: true };
}
function lluviaHora(v, celdas) {
    if (!v) return { media: null, max: 0, cobertura: 0 };
    let suma = 0, max = 0, cubiertas = 0;
    for (const k of celdas.dentro) {
        if (v[k] === LLUVIA_SIN) continue;
        const mm = v[k] / 100;
        suma += mm; cubiertas++; if (mm > max) max = mm;
    }
    return { media: cubiertas ? suma / cubiertas : null, max, cobertura: cubiertas / celdas.dentro.length };
}
// Grafico de barras de las ultimas horas (media sobre la cuenca, mm/h)
function graficoLluvia(serie) {
    const W = 320, H = 110, m = { l: 26, r: 6, t: 8, b: 18 }, n = serie.length;
    const vmax = Math.max(1, ...serie.map(s => s.media || 0)), bw = (W - m.l - m.r) / n;
    const y = v => m.t + (H - m.t - m.b) * (1 - v / vmax);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin-top:4px;" font-size="9" fill="#8892b0">`;
    svg += `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="#0f3460"/>`;
    [0, vmax / 2, vmax].forEach(v => svg += `<text x="${m.l - 3}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(v < 10 && v % 1 ? 1 : 0)}</text>`);
    serie.forEach((s, i) => {
        const x = m.l + i * bw;
        if (s.media == null) svg += `<rect x="${x + 1}" y="${m.t}" width="${bw - 2}" height="${H - m.t - m.b}" fill="#ffffff" opacity="0.05"><title>${s.etiqueta}: sin datos</title></rect>`;
        else svg += `<rect x="${x + 1}" y="${y(s.media)}" width="${Math.max(bw - 2, 1)}" height="${H - m.b - y(s.media)}" fill="#29B6F6"><title>${s.etiqueta}: ${fmtMm(s.media)} mm (max ${fmtMm(s.max)})</title></rect>`;
        if (i % 6 === (n - 1) % 6) svg += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${s.hora}</text>`;
    });
    return svg + "</svg>";
}
const fmtMm = v => v == null ? "-" : v === 0 ? "0" : v < 0.05 ? "<0,1" : v < 10 ? v.toFixed(1).replace(".", ",") : v.toFixed(0);
// Volumen caido sobre la cuenca: 1 mm sobre 1 km² = 1.000 m³ = 1 millon de litros
// Numero en español con punto de miles tambien en las cifras de 4 digitos (toLocaleString no lo pone)
function numES(v, dec = 0) {
    const [e, d] = v.toFixed(dec).split(".");
    return e.replace(/\B(?=(\d{3})+$)/g, ".") + (d && +d ? "," + d.replace(/0+$/, "") : "");
}
// Celda de la cuenca con mas lluvia en las ultimas h horas: { k, mm, lon, lat } (o null)
function maxCuenca(d, celdas, h) {
    let best = null;
    for (const k of celdas.dentro) {
        const mm = acumCelda(d, k, h);
        if (mm != null && (!best || mm > best.mm)) best = { k, mm };
    }
    if (!best) return null;
    const c = best.k % d.W, f = Math.floor(best.k / d.W);
    [best.lon, best.lat] = proj4(d.proj, "EPSG:4326", [d.ox + (c + 0.5) * d.rx, d.oy + (f + 0.5) * d.ry]);
    return best;
}
// Lluvia de cada hora en una celda (mm; null sin cobertura)
const serieCelda = (d, k) => d.horas.map(hh => !hh.v || hh.v[k] === LLUVIA_SIN ? null : hh.v[k] / 100);
// Media de la cuenca en cada hora
const serieMedia = (d, celdas) => d.horas.map(hh => lluviaHora(hh.v, celdas).media);
// Fraccion de celdas de la cuenca con dato en alguna de las ultimas h horas
function coberturaCuenca(d, celdas, h) {
    let n = 0;
    for (const k of celdas.dentro) if (acumCelda(d, k, h) != null) n++;
    return n / celdas.dentro.length;
}
// Grafico de todas las horas: barras de mm/h (eje izq.) y linea de acumulado del periodo elegido (eje der.)
function graficoAcumulado(d, vals, h) {
    const W = 340, H = 175, m = { l: 30, r: 30, t: 16, b: 20 }, n = vals.length, bw = (W - m.l - m.r) / n;
    const [ini, finT] = tramoH(d, h), dentro = i => i >= ini && i < finT;
    // Etiquetas del eje: la hora cada 6 h (radar) o el dia y la hora cada 12 h (prevision, hasta 51 h)
    const cada = d.prevision ? 12 : 6;
    const etq = i => d.prevision ? d.horas[i].fin.toLocaleString("es-ES", { weekday: "short", hour: "2-digit" }) + " h" : horaLocal(d.horas[i].fin);
    const marca = i => d.prevision ? d.horas[i].fin.getHours() % cada === 0 : i % cada === (n - 1) % cada;
    const acum = []; let s = 0;
    vals.forEach((v, i) => { if (dentro(i)) s += v || 0; acum.push(dentro(i) ? s : null); });
    const tope = v => { const e = [1, 2, 5, 10, 20, 30, 50, 75, 100, 150, 200, 300, 500]; return e.find(x => x >= v) || Math.ceil(v); };
    const vmax = tope(Math.max(0.5, ...vals.map(v => v || 0))), amax = tope(Math.max(0.5, s));
    const yb = v => m.t + (H - m.t - m.b) * (1 - v / vmax), ya = v => m.t + (H - m.t - m.b) * (1 - v / amax);
    let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" font-size="9" fill="#8892b0">`;
    g += `<rect x="${m.l + ini * bw}" y="${m.t}" width="${(finT - ini) * bw}" height="${H - m.t - m.b}" fill="#29B6F6" opacity="0.07"/>`;
    [0, 0.5, 1].forEach(f => {
        const y = m.t + (H - m.t - m.b) * (1 - f);
        g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="#0f3460"/>`
            + `<text x="${m.l - 3}" y="${y + 3}" text-anchor="end">${numES(vmax * f, vmax * f % 1 ? 1 : 0)}</text>`
            + `<text x="${W - m.r + 3}" y="${y + 3}" fill="#FFB74D">${numES(amax * f, amax * f % 1 ? 1 : 0)}</text>`;
    });
    g += `<text x="2" y="${m.t - 6}" font-size="8">mm/h</text><text x="${W - 2}" y="${m.t - 6}" text-anchor="end" font-size="8" fill="#FFB74D">mm acumulados</text>`;
    vals.forEach((v, i) => {
        const x = m.l + i * bw, hora = horaLocal(d.horas[i].fin);
        if (v == null) g += `<rect x="${x + 0.5}" y="${m.t}" width="${bw - 1}" height="${H - m.t - m.b}" fill="#fff" opacity="0.04"><title>Hasta las ${hora}: sin datos</title></rect>`;
        else if (v > 0) g += `<rect x="${x + 0.5}" y="${yb(v)}" width="${Math.max(bw - 1, 1)}" height="${H - m.b - yb(v)}" fill="${dentro(i) ? "#29B6F6" : "#3d5a80"}"><title>${d.prevision ? `Hasta el ${fechaHora(d.horas[i].fin)}` : `Hasta las ${hora}`}:${fmtMm(v)} mm</title></rect>`;
        if (marca(i)) g += `<text x="${d.prevision ? x + bw : x + bw / 2}" y="${H - 6}" text-anchor="middle">${etq(i)}</text>`;
    });
    const pts = acum.map((a, i) => a == null ? null : `${m.l + (i + 1) * bw},${ya(a)}`).filter(Boolean);
    if (pts.length) g += `<polyline points="${m.l + ini * bw},${ya(0)} ${pts.join(" ")}" fill="none" stroke="#FFB74D" stroke-width="2"/>`;
    return g + "</svg>";
}

async function lluviaRadarCuenca(boton) {
    if (!cuencaActual) return;
    const { geom } = cuencaActual;
    if (boton) boton.disabled = true;
    const salida = document.createElement("span");
    boton?.insertAdjacentElement("afterend", salida);
    const escribir = h => { salida.innerHTML = h; };
    escribir(`\n<span class="r-info">Leyendo el radar...</span>`);
    try {
        const d = await cargarLluvia((n, t) => escribir(`\n<span class="r-info">Leyendo el radar... ${n}/${t} h</span>`));
        const celdas = celdasCuenca(d, geom);
        if (!celdas) throw new Error("la cuenca queda fuera del compuesto de OPERA (no incluye Canarias)");
        const serie = d.horas.map(hh => {
            const loc = horaLocal(hh.fin);
            return { ...lluviaHora(hh.v, celdas), hora: loc, etiqueta: `Hasta las ${loc}` };
        });
        const ult = serie[LLUVIA_HORAS - 1];
        const acum = h => {
            const tramo = serie.slice(-h), ok = tramo.filter(s => s.media != null);
            return { mm: ok.reduce((a, s) => a + s.media, 0), faltan: h - ok.length };
        };
        const finTxt = d.fin.toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        const filas = [1, 3, 6, 12, 24].map(h => {
            const a = acum(h), mx = maxCuenca(d, celdas, h);
            return `${String(h).padStart(2)} h: ${fmtMm(a.mm)} mm${mx ? ` <span class="r-info">· punto mas lluvioso ${fmtMm(mx.mm)} mm</span>` : ""}${a.faltan ? ` <span class="r-info">(faltan ${a.faltan} h)</span>` : ""}`;
        });
        const cob = ult.media == null ? null : ult.cobertura;
        let h = `\n<span class="r-label">Lluvia estimada por radar</span> <span class="r-info">(hasta las ${finTxt})</span>
<span class="r-name">${fmtMm(ult.media)} mm</span> <span class="r-info">de media en la ultima hora${ult.media != null ? ` · punto mas lluvioso: ${fmtMm(ult.max)} mm` : ""}</span>
<span class="r-info">Acumulado (media sobre la cuenca):</span>
  ${filas.join("\n  ")}`;
        h += graficoLluvia(serie);
        const avisos = [];
        if (celdas.centroide) avisos.push("La cuenca es menor que una celda del radar (2 km): se da el valor de la celda que la contiene.");
        else avisos.push(`${celdas.dentro.length.toLocaleString("es-ES")} celdas de 2 km.`);
        if (cob != null && cob < 0.98) avisos.push(`Solo el ${(cob * 100).toFixed(0)} % de la cuenca tiene cobertura de radar en OPERA; el resto queda fuera de la media.`);
        if (ult.media == null) avisos.push("La ultima hora no tiene cobertura de radar en esta cuenca.");
        avisos.push("Estimacion de radar sin ajustar con pluviometros: puede infra o sobrestimar, sobre todo con lluvia intensa o tras montañas. Con tope de 100 mm por hora y celda (granizo).");
        h += `<span class="r-info" style="font-size:11px;">${avisos.join(" ")}\nFuente: compuesto OPERA de EUMETNET (radares de AEMET y vecinos), CC BY 4.0.</span>`;
        escribir(h);
        if (boton) boton.style.display = "none";
        salida.scrollIntoView({ behavior: "smooth", block: "end" });
    } catch (e) {
        escribir(`\n<span style="color:#ff6b6b;">No se pudo leer el radar: ${escapeHtml(e.message)}</span>`);
        if (boton) boton.disabled = false;
    }

// PNOA desde el 14. En 3D, lo lejano usa teselas de menos zoom y se veian dos imagenes. El IGN

// Ficha de una estacion: caudal y nivel (aforos) o lluvia y temperatura, con su grafico
async function popupSaih(k, e) {
    const pop = L.popup({ maxWidth: 380 }).setLatLng([e.lat, e.lon]).setContent(`<b>${escapeHtml(nombreEst(e.nombre))}</b><br>Cargando...`).openOn(map);
    const aforo = k === "q" || k === "n";
    const [a, b] = await Promise.all((aforo ? ["q", "n"] : ["p", "t"]).map(x => saihSerie(x, e.id).catch(() => null)));
    const ult = s => ultimoYCambio(s, 3), cuando = t => new Date(t).toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const filas = [];
    let graf = "", tUlt = 0;
    if (aforo) {
        const q = ult(a), nv = ult(b), umb = b?.umb || [];
        if (q) { filas.push(["Caudal", `<b>${fmtQ(q.v)} m³/s</b>${q.dif != null ? ` <span style="color:#777">(${q.dif >= 0 ? "+" : "−"}${fmtQ(Math.abs(q.dif))} en 3 h)</span>` : ""}`]); tUlt = Math.max(tUlt, q.t); }
        if (nv) {
            let av = null; for (const x of umb) if (nv.v >= x.value) av = x;
            filas.push(["Nivel", `<b>${numES(nv.v, 2)} m</b>${av ? ` <span style="color:${av.color};text-shadow:0 0 1px #000">⚠ umbral ${numES(av.value, 2)} m</span>` : ""}`]);
            tUlt = Math.max(tUlt, nv.t);
        }
        if (umb.length) filas.push(["Umbrales de nivel", umb.map(x => `<span style="color:${x.color};text-shadow:0 0 1px #000">●</span> ${numES(x.value, 2)} m`).join(" ")]);
        graf = graficoAforo({ q: a, n: b, umb }, 3, true);
    } else {
        const tt = ult(b);
        if (a?.t.length) { filas.push(["Lluvia", [1, 3, 6, 12, 24].map(h => { const p = saihPrec(a, h); return p == null ? null : `${h} h: <b>${numES(p, 1)}</b>`; }).filter(Boolean).join(" · ") + " mm"]); tUlt = Math.max(tUlt, a.t[a.t.length - 1]); }
        if (tt) { filas.push(["Temperatura", `<b>${numES(tt.v, 1)} °C</b>`]); tUlt = Math.max(tUlt, tt.t); }
        // Agrupado por horas para el grafico de barras y linea de las estaciones
        const horas = new Map();
        const meter = (s, campo) => s?.t.forEach((t, i) => {
            if (s.v[i] == null) return;
            const hk = Math.ceil(t / 3600000) * 3600000, o = horas.get(hk) || { t: hk, prec: null, ta: null };
            o[campo] = campo === "prec" ? (o.prec || 0) + s.v[i] : s.v[i];
            horas.set(hk, o);
        });
        meter(a, "prec"); meter(b, "ta");
        const obs = [...horas.values()].sort((x, y) => x.t - y.t).slice(-24);
        if (obs.length) graf = graficoEstacion({ obs });
    }
    const html = `<div style="font-size:12px;min-width:250px"><b>${escapeHtml(nombreEst(e.nombre))}</b> <span style="color:#777">(${SAIH_DEMAR[e.demar] || "SAIH"})</span><br>`
        + (filas.length ? `<span style="color:#777">Ultimo dato: ${cuando(tUlt)}</span><table style="margin-top:4px;border-collapse:collapse">${filas.map(([x, y]) => `<tr><td style="color:#555;padding-right:8px;vertical-align:top">${x}</td><td>${y}</td></tr>`).join("")}</table>${graf}`
            : `<span style="color:#b00">${argosSinRed ? escapeHtml(msgArgos()) : `Sin datos en el Observatorio del Agua${e.demar == 21 ? " (la CH Duero no los publica)" : ""}.`}</span>`)
        + `<br><span style="color:#999;font-size:10px">SAIH via Observatorio del Agua (MITECO) · tiempo real sin validar</span></div>`;
    if (map.hasLayer(pop)) pop.setContent(html);
}

// --- CERCA DE MI: geolocalizacion + rios/embalses mas proximos ---
async function buscarCercanos() {
    clearMap();
    document.getElementById("info-banner").style.display = "none";
    document.getElementById("btn-cerca").disabled = true;
    setResult(`<span class="r-info">Obteniendo ubicacion...</span>`);
    if (!navigator.geolocation) {
        setResult(`<span style="color:#ff6b6b;">Su navegador no soporta geolocalizacion.</span>`);
        document.getElementById("btn-cerca").disabled = false;
        return;
    }
    navigator.geolocation.getCurrentPosition(async pos => {
        try {
            const lon = pos.coords.longitude, lat = pos.coords.latitude, acc = pos.coords.accuracy;
            const userPt = turf.point([lon, lat]);
            lastCercaPt = [lon, lat];
            userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Mi ubicacion").openPopup();
            userAccCircle = L.circle([lat, lon], { radius: acc, color:"#64B5F6", fillOpacity:0.08, weight:1 }).addTo(map);
            map.setView([lat, lon], 12);

            setResult(`<span class="r-info">Buscando rios y embalses cercanos...</span>`);
            showProgress(10, "Buscando en la zona...");

            // Amplia el radio de busqueda si en la primera pasada no hay suficientes resultados
            // (zonas rurales con pocos cauces/embalses cercanos)
            // Rios (MITECO) y embalses (IGN) son servicios distintos: si uno falla,
            // se sigue con el otro y se avisa, en vez de abortar toda la busqueda.
            let deg = 0.05, riverGroups = new Map(), embGroups = new Map();
            const fallos = new Set();
            for (let attempt = 0; attempt < 4; attempt++) {
                const bbox = `${lon-deg},${lat-deg},${lon+deg},${lat+deg}`;
                showProgress(10 + attempt*18, `Buscando en un radio de ~${Math.round(deg*111)} km...`);
                const [rRios, rEmb] = await Promise.allSettled([
                    fetchBbox(OGC_RIOS, bbox, PAGE_LIMIT),
                    fetchBbox(OGC_EMBALSES, bbox, 200)
                ]);
                if (rRios.status === "rejected") { fallos.add("rios (MITECO)"); console.error("Cerca de mi - rios:", rRios.reason); }
                if (rEmb.status === "rejected") { fallos.add("embalses (IGN)"); console.error("Cerca de mi - embalses:", rEmb.reason); }
                if (fallos.size === 2) throw new Error("No responden los servicios de rios ni de embalses. Intentelo de nuevo en unos minutos.");
                const riverFeats = rRios.status === "fulfilled" ? rRios.value : [];
                const embFeats = rEmb.status === "fulfilled" ? rEmb.value : [];
                riverGroups = new Map();
                riverFeats.forEach(f => {
                    const name = f.properties?.nom_rio; if (!name) return;
                    let d; try { d = turf.pointToLineDistance(userPt, f, {units:"kilometers"}); } catch { return; }
                    if (!riverGroups.has(name) || d < riverGroups.get(name).d) riverGroups.set(name, {d, feat:f});
                });
                embGroups = new Map();
                embFeats.forEach(f => {
                    const name = f.properties?.nombre; if (!name) return;
                    let d;
                    try {
                        d = turf.booleanPointInPolygon(userPt, f) ? 0 : turf.pointToLineDistance(userPt, turf.polygonToLine(f), {units:"kilometers"});
                    } catch { return; }
                    if (!embGroups.has(name) || d < embGroups.get(name).d) embGroups.set(name, {d, feat:f});
                });
                const okRios = fallos.has("rios (MITECO)") || riverGroups.size >= 5;
                const okEmb = fallos.has("embalses (IGN)") || embGroups.size >= 3;
                if (okRios && okEmb) break;
                deg *= 2.2;
            }
            hideProgress();

            const rivers = [...riverGroups.entries()].sort((a,b) => a[1].d - b[1].d).slice(0, 6);
            const embalses = [...embGroups.entries()].sort((a,b) => a[1].d - b[1].d).slice(0, 6);

            if (!rivers.length && !embalses.length) {
                setResult(`<span class="r-info">No se encontraron rios ni embalses en un radio de ~${Math.round(deg*111)} km.</span>`);
                return;
            }

            let html = `<span class="r-name">Cerca de su ubicacion</span>\n<span class="r-info">lon=${lon.toFixed(5)}, lat=${lat.toFixed(5)} (precision ~${Math.round(acc)} m)</span>\n`;
            if (fallos.size) html += `\n<span style="color:#ffb74d;">Aviso: no ha respondido el servicio de ${[...fallos].join(" ni el de ")}; se muestran solo los resultados disponibles.</span>\n`;
            if (rivers.length) {
                html += `\n<span class="r-label">Rios mas proximos (click para ver detalle):</span>`;
                rivers.forEach(([name, {d}]) => {
                    html += `\n<span class="r-cerca-item" data-type="rio" data-name="${escapeHtml(name)}" style="cursor:pointer;color:#00BCD4;text-decoration:underline;">${name}</span> <span class="r-info">(${d.toFixed(1)} km)</span>`;
                });
            }
            if (embalses.length) {
                html += `\n\n<span class="r-label">Embalses mas proximos (click para ver detalle):</span>`;
                embalses.forEach(([name, {d}]) => {
                    html += `\n<span class="r-cerca-item" data-type="embalse" data-name="${escapeHtml(name)}" style="cursor:pointer;color:#2196F3;text-decoration:underline;">${name}</span> <span class="r-info">(${d===0?"aqui mismo":d.toFixed(1)+" km"})</span>`;
                });
            }
            setResult(html);

            // Vista previa en el mapa (lineas/poligonos finos) sin necesidad de hacer click.
            // No se hace fitBounds a todos los resultados: el mas lejano puede estar a
            // bastantes km y dejaria el mapa demasiado alejado para ver los mas cercanos
            // (que son los relevantes de un vistazo). Se mantiene el zoom fijo sobre la
            // ubicacion del usuario; cada item sigue siendo clicable para ir a el.
            cercaLayer = L.layerGroup().addTo(map);
            rivers.forEach(([name, {feat}], i) => {
                L.geoJSON(feat, { style:{ color:"#00BCD4", weight: i===0?3:2, opacity:0.7, dashArray: i===0?null:"4 4" } }).addTo(cercaLayer);
            });
            embalses.forEach(([name, {feat}]) => {
                L.geoJSON(feat, { style:{ color:"#2196F3", weight:1.5, fillColor:"#2196F3", fillOpacity:0.25 } }).addTo(cercaLayer);
            });

        } catch (e) { setResult(`<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
        finally { hideProgress(); document.getElementById("btn-cerca").disabled = false; }
    }, err => {
        const m = {1:"Permiso denegado.",2:"Ubicacion no disponible.",3:"Tiempo agotado."};
        setResult(`<span style="color:#ff6b6b;">${m[err.code]||"Error."}</span>`);
        document.getElementById("btn-cerca").disabled = false;
    }, { enableHighAccuracy:true, timeout:15000 });
}

// --- Argos Hydro: estaciones de aforo y embalses ---
// La API real de Argos no tiene CORS habilitado, así que no se puede llamar
// directamente desde una web estática (GitHub Pages). ARGOS_BASE apunta a un
// Cloudflare Worker propio que solo reenvía la petición añadiendo las
// cabeceras CORS (código en argos-proxy-worker/worker.js) — funciona igual
// en local que en producción, sin depender de server.js.
const ARGOS_BASE = "https://argos-hydro-proxy.riosyembalses.workers.dev";
const ARGOS_API = ARGOS_BASE + "/api";
const ARGOS_WFS = ARGOS_BASE + "/geoserver/wfs";
// El WFS del Observatorio admite CORS (oct-2026) y no pide token: se llama directo y el
// proxy queda de reserva. El login y las series siguen necesitando el proxy.
const ARGOS_WFS_DIRECTO = "https://observatorio-dga.argos-hydro.com/geoserver/wfs";
let argosToken = null, argosLayer = null, lastSaihResults = [];
let argosSinRed = false, argosFalloT = 0;   // el proxy no responde (p. ej. bloqueo de LaLiga)
// Tras un fallo de red no se reintenta en 1 min (cada intento tarda ~20 s en fallar)
const argosCaido = () => argosSinRed && Date.now() - argosFalloT < 60000;
const argosMarcarCaido = e => { if (e instanceof TypeError) { argosSinRed = true; argosFalloT = Date.now(); } };
const msgArgos = () => argosSinRed ? `el proxy de Cloudflare no responde. ${AVISO_BLOQUEO}` : "no se pudo conectar con el Observatorio del Agua";

async function argosLogin() {
    if (argosToken) return argosToken;
    if (argosCaido()) return null;
    try {
        const r = await fetch(`${ARGOS_API}/Authorization`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: "Brcuenca", password: "MamaPato25" })
        });
        argosSinRed = false;
        if (!r.ok) return null;
        argosToken = (await r.json()).accessToken;
        return argosToken;
    } catch (e) { argosMarcarCaido(e); return null; }
}

async function argosChart(productId, elementId) {
    const tk = await argosLogin();
    if (!tk || argosCaido()) return null;
    try {
        const r = await fetch(`${ARGOS_API}/Map/chart/product/${productId}/element/${elementId}`, { headers: { Authorization: `Bearer ${tk}` } });
        argosSinRed = false;
        if (!r.ok) return null;
        return await r.json();
    } catch (e) { argosMarcarCaido(e); return null; }
}

async function argosWfs(productId, iconType, bbox) {
    const q = `?service=WFS&version=2.0.0&request=GetFeature&typeNames=argos:sensors&outputFormat=application/json&count=5000&viewParams=id_account:${ARGOS_ACCOUNT};id_product:${productId};icon_type:${iconType};icon_format:png;feature_type:product_sensors&bbox=${bbox},EPSG:4326`;
    for (const base of [ARGOS_WFS_DIRECTO, ARGOS_WFS]) {
        try {
            const r = await fetch(base + q);
            if (r.ok) return (await r.json()).features || [];
        } catch { }
    }
    return [];
}

// Pluviometros SAIH: el Observatorio del Agua da de cada uno las ultimas 24 h, con lo
// llovido en cada intervalo (10 o 15 min segun la confederacion). El Duero no los
// publica y el Guadalquivir casi ninguno (oct-2026).
const ARGOS_PP = "01929098-d109-7d01-8fa3-b23e468f9031";
const SAIH_DEMAR = { 11: "CH Miño-Sil", 17: "CH Cantabrico (oriental)", 18: "CH Cantabrico", 21: "CH Duero", 31: "CH Tajo", 40: "CH Guadiana", 51: "CH Guadalquivir", 71: "CH Segura", 81: "CH Jucar", 91: "CH Ebro" };
async function cargarSaihCuenca(geom) {
    const [w, s, e, n] = turf.bbox(geom);
    if (!await argosLogin()) throw new Error(msgArgos());
    const fs = (await argosWfs(ARGOS_PP, "rain", `${w},${s},${e},${n}`)).filter(f => f.geometry?.coordinates &&
        geom.features.some(g => { try { return turf.booleanPointInPolygon(f.geometry.coordinates, g); } catch { return false; } }));
    const est = fs.map(f => ({ id: f.properties.id_element, nombre: f.properties.name, demar: normDemar(f.properties.cod_demar), lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], t: [], v: [] }));
    let i = 0;
    const tarea = async () => {
        while (i < est.length) {
            const e = est[i++], c = await argosChart(ARGOS_PP, e.id);
            if (c?.dates?.length) { e.t = c.dates.map(x => Date.parse(x)); e.v = c.values.map(x => x == null ? null : +x); }
        }
    };
    await Promise.all(Array.from({ length: 8 }, tarea));
    return est;
}
// mm de las ultimas h horas contadas desde el ultimo dato de la estacion; null si es de
// hace mas de 3 h o si faltan mas del 25 % de los intervalos
function saihPrec(e, h) {
    const n = e.t.length;
    if (n < 2 || Date.now() - e.t[n - 1] > 3 * 3600000) return null;
    const difs = e.t.slice(1).map((x, j) => x - e.t[j]).sort((a, b) => a - b);
    const paso = Math.max(5, Math.min(60, difs[difs.length >> 1] / 60000));
    const desde = e.t[n - 1] - h * 3600000;
    let mm = 0, k = 0;
    for (let j = 0; j < n; j++) if (e.t[j] > desde && e.v[j] != null) { mm += e.v[j]; k++; }
    return k * paso >= h * 60 * 0.75 ? mm : null;
}

// Aforos SAIH (caudal y nivel) dentro de la cuenca o a menos de 1 km del punto de cierre
// (el aforo del cierre suele quedar justo en el borde). Ultimas 24 h de cada uno.
async function cargarAforosCuenca(geom, punto) {
    const [w, s, e, n] = turf.bbox(geom), bb = `${w - 0.01},${s - 0.01},${e + 0.01},${n + 0.01}`;
    if (!await argosLogin()) throw new Error(msgArgos());
    const [fq, fn] = await Promise.all([argosWfs(ARGOS_PF, "river_flow", bb), argosWfs(ARGOS_PL, "river_level", bb)]);
    const porId = new Map();
    for (const [f, k] of [...fq.map(f => [f, "q"]), ...fn.map(f => [f, "n"])]) {
        const c = f.geometry?.coordinates;
        if (!c) continue;
        let a = porId.get(f.properties.id_element);
        if (!a) {
            const dist = punto ? turf.distance(punto, c) : null;
            const dentro = (dist != null && dist < 1) || geom.features.some(g => { try { return turf.booleanPointInPolygon(c, g); } catch { return false; } });
            if (!dentro) continue;
            porId.set(f.properties.id_element, a = { id: f.properties.id_element, nombre: f.properties.name, demar: normDemar(f.properties.cod_demar), lon: c[0], lat: c[1], dist, q: null, n: null, umb: [] });
        }
        a[k] = { t: [], v: [] };
    }
    const aforos = [...porId.values()], tareas = aforos.flatMap(a => ["q", "n"].filter(k => a[k]).map(k => [a, k]));
    let i = 0;
    const tarea = async () => {
        while (i < tareas.length) {
            const [a, k] = tareas[i++], c = await argosChart(k === "q" ? ARGOS_PF : ARGOS_PL, a.id);
            if (c?.dates?.length) {
                a[k] = { t: c.dates.map(x => Date.parse(x)), v: c.values.map(x => x == null ? null : +x) };
                if (k === "n" && c.thresholds?.length) a.umb = c.thresholds.slice().sort((x, y) => x.value - y.value);
            }
        }
    };
    await Promise.all(Array.from({ length: 8 }, tarea));
    return aforos;
}
// Ultimo valor de una serie y su cambio respecto a h horas antes
function ultimoYCambio(s, h) {
    if (!s?.t.length) return null;
    let j = s.t.length - 1;
    while (j >= 0 && s.v[j] == null) j--;
    if (j < 0) return null;
    const desde = s.t[j] - h * 3600000;
    let k = 0;
    while (k < j && (s.t[k] < desde - 900000 || s.v[k] == null)) k++;
    const cubre = s.t[k] <= desde + 1800000;
    return { v: s.v[j], t: s.t[j], dif: cubre && k < j ? s.v[j] - s.v[k] : null };
}
// Color de aviso del ultimo nivel segun los umbrales de la confederacion
function avisoAforo(a) {
    const n = ultimoYCambio(a.n, 1);
    let r = null;
    if (n) for (const u of a.umb) if (n.v >= u.value) r = u;
    return r;
}
const fmtQ = v => numES(v, v < 10 ? 2 : v < 100 ? 1 : 0);
// Hidrograma de las ultimas 24 h (caudal, o nivel si no hay caudal) con los umbrales de nivel
function graficoAforo(a, h, claro) {
    const k = a.q?.t.length ? "q" : "n", s = a[k];
    if (!s?.t.length) return "";
    const W = 340, H = 150, m = { l: 36, r: 10, t: 16, b: 20 };
    const pts = s.t.map((t, i) => [t, s.v[i]]).filter(p => p[1] != null);
    if (!pts.length) return "";
    const t1 = pts[pts.length - 1][0], t0 = t1 - 24 * 3600000;
    const umb = k === "n" ? a.umb : [];
    let vmin = Math.min(...pts.map(p => p[1])), vmax = Math.max(...pts.map(p => p[1]));
    if (umb.length) vmax = Math.max(vmax, Math.min(umb[0].value, vmax * 1.5));
    if (vmax - vmin < 0.01) { vmax += 0.5; vmin = Math.max(0, vmin - 0.5); }
    const pad = (vmax - vmin) * 0.1; vmin = Math.max(0, vmin - pad); vmax += pad;
    const x = t => m.l + (W - m.l - m.r) * (t - t0) / (t1 - t0), y = v => m.t + (H - m.t - m.b) * (1 - (v - vmin) / (vmax - vmin));
    const dec = vmax - vmin < 0.1 ? 3 : vmax < 10 ? 2 : vmax < 100 ? 1 : 0;
    let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" font-size="9" fill="#8892b0">`;
    g += `<rect x="${x(t1 - h * 3600000)}" y="${m.t}" width="${x(t1) - x(t1 - h * 3600000)}" height="${H - m.t - m.b}" fill="${claro ? "#8E24AA" : "#CE93D8"}" opacity="0.07"/>`;
    [0, 0.5, 1].forEach(f => {
        const v = vmin + (vmax - vmin) * f;
        g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${claro ? "#e0e0e0" : "#0f3460"}"/><text x="${m.l - 3}" y="${y(v) + 3}" text-anchor="end">${numES(v, dec)}</text>`;
    });
    for (const u of umb) if (u.value <= vmax) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(u.value)}" y2="${y(u.value)}" stroke="${u.color}" stroke-dasharray="4 3"><title>Umbral ${u.conditionSymbol || "≥"} ${numES(u.value, 2)} m</title></line>`;
    g += `<text x="2" y="${m.t - 6}" font-size="8">${k === "q" ? "m³/s" : "m"}</text>`;
    for (let hh = 0; hh <= 24; hh += 6) { const t = t1 - hh * 3600000; g += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${horaLocal(new Date(t))}</text>`; }
    g += `<polyline points="${pts.filter(p => p[0] >= t0).map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${claro ? "#8E24AA" : "#CE93D8"}" stroke-width="2"/>`;
    return g + "</svg>";
}

// Confederaciones que no envian al Observatorio (comprobado en toda Espana, oct-2026): el
// Duero nada; el Guadalquivir casi ningun pluviometro ni termometro (si caudal y nivel).
// q caudal, n nivel, p lluvia, t temperatura
const SAIH_NO_PUBLICA = { 21: "qnpt", 51: "pt" };
// Algunas estaciones traen el nombre de la demarcacion en vez del codigo
const normDemar = d => ({ "JÚCAR": "81", "JUCAR": "81", "TAJO": "31" })[String(d || "").toUpperCase()] || String(d || "");
// De esas confederaciones, las que aparecen en la lista sin ningun dato. Al resto (con
// estaciones vacias ahora) no se les achaca que no publiquen.
const demarSinDatos = (lista, tiene, k) => {
    const d = new Map();
    for (const x of lista) d.set(x.demar, (d.get(x.demar) || false) || tiene(x));
    return [...d].filter(([c, ok]) => !ok && SAIH_NO_PUBLICA[c]?.includes(k)).map(([c]) => SAIH_DEMAR[c]);
};
// Una sola descarga por cuenca, compartida por el panel lateral y la ficha
const saihDe = c => c.pSaih ??= cargarSaihCuenca(c.geom);
const aforosDe = c => c.pAforos ??= cargarAforosCuenca(c.geom, c.punto);

// Panel lateral: aforos y pluviometros SAIH de la cuenca recien calculada, y sus marcas
// en el mapa (dentro de cuencaLayer, asi se quitan con la cuenca)
async function saihEnPanel() {
    const c = cuencaActual, box = document.getElementById("result-box");
    if (!c || !box) return;
    const sal = document.createElement("span");
    box.appendChild(sal);
    sal.innerHTML = `\n\n<span class="r-label">Datos SAIH de la confederacion</span>\n<span class="r-info">Leyendo aforos y pluviometros...</span>`;
    const [af, pl] = await Promise.all([aforosDe(c).catch(() => null), saihDe(c).catch(() => null)]);
    if (cuencaActual !== c || !sal.isConnected) return;
    const capa = cuencaLayer;
    let h = `\n\n<span class="r-label">Datos SAIH de la confederacion</span>`;
    const huecos = new Set();
    // Aforos
    if (af == null) h += `\n<span style="color:#ff6b6b;">No se pudieron leer los aforos.</span>`;
    else {
        const con = af.filter(a => a.q?.t.length || a.n?.t.length);
        demarSinDatos(af, a => con.includes(a), "q").forEach(x => huecos.add(x));
        const orden = a => a.dist != null && a.dist < 1 ? -1e9 + a.dist : -(ultimoYCambio(a.q, 24)?.v ?? -1);
        con.sort((a, b) => orden(a) - orden(b));
        if (!af.length) h += `\n<span class="r-info">No hay aforos SAIH en la cuenca.</span>`;
        else if (con.length) {
            h += `\n<span class="r-info">Caudal y nivel ahora (cambio en 24 h):</span>`;
            for (const a of con.slice(0, 8)) {
                const q = ultimoYCambio(a.q, 24), nv = ultimoYCambio(a.n, 24), av = avisoAforo(a);
                const dif = (x, f) => x?.dif == null ? "" : ` <span class="r-info">(${Math.abs(x.dif) < 0.005 ? "=" : (x.dif > 0 ? "+" : "−") + f(Math.abs(x.dif))})</span>`;
                h += `\n  <span style="color:${av?.color || "#4CAF50"}">●</span> ${escapeHtml(nombreEst(a.nombre))}${a.dist != null && a.dist < 1 ? ` <span class="r-info">(cierre)</span>` : ""}: `
                    + [q ? `<b>${fmtQ(q.v)} m³/s</b>${dif(q, fmtQ)}` : "", nv ? `${numES(nv.v, 2)} m${dif(nv, v => numES(v, 2))}` : ""].filter(Boolean).join(" · ")
                    + (av ? ` <span style="color:${av.color}">⚠ umbral</span>` : "");
                if (capa) L.circleMarker([a.lat, a.lon], { radius: a.dist != null && a.dist < 1 ? 8 : 6, fillColor: av?.color || "#4CAF50", color: "#fff", weight: 2, fillOpacity: 0.95 })
                    .bindTooltip(`${escapeHtml(nombreEst(a.nombre))}${q ? ` — ${fmtQ(q.v)} m³/s` : nv ? ` — ${numES(nv.v, 2)} m` : ""}`, { permanent: true, direction: "right", offset: [10, 0], className: "saih-label" })
                    .addTo(capa);
            }
            if (con.length > 8) h += `\n  <span class="r-info">y ${con.length - 8} mas (en la ficha de la cuenca)</span>`;
            if (af.length > con.length) h += `\n  <span class="r-info">${af.length - con.length} aforo${af.length - con.length > 1 ? "s" : ""} sin datos ahora.</span>`;
        } else if (!huecos.size) h += `\n<span class="r-info">${af.length} aforo${af.length > 1 ? "s" : ""} en la cuenca, sin datos ahora.</span>`;
    }
    // Pluviometros
    if (pl == null) h += `\n<span style="color:#ff6b6b;">No se pudieron leer los pluviometros.</span>`;
    else if (pl.length) {
        demarSinDatos(pl, e => e.t.length > 0, "p").forEach(x => huecos.add(x));
        const per = [1, 3, 6, 12, 24].map(hh => {
            const v = pl.map(e => ({ e, mm: saihPrec(e, hh) })).filter(x => x.mm != null);
            return { hh, n: v.length, media: v.length ? v.reduce((a, x) => a + x.mm, 0) / v.length : null, max: v.sort((a, b) => b.mm - a.mm)[0] };
        }).filter(x => x.n);
        if (per.length) {
            const n = Math.max(...per.map(x => x.n)), d24 = per.find(x => x.hh === 24);
            h += `\n<span class="r-info">Lluvia medida en ${n} pluviometro${n > 1 ? "s" : ""} (media · maximo):</span>\n  `
                + per.map(x => `${x.hh} h: <b>${fmtMm(x.media)}</b> · ${fmtMm(x.max.mm)} mm`).join("\n  ")
                + (d24?.max.mm > 0 ? `\n  <span class="r-info">El mas lluvioso en 24 h: ${escapeHtml(nombreEst(d24.max.e.nombre))}</span>` : "");
            if (capa) for (const e of pl) {
                const mm = saihPrec(e, 24);
                if (mm == null) continue;
                L.circleMarker([e.lat, e.lon], { radius: 5, fillColor: "#2E7D32", color: "#fff", weight: 1.5, fillOpacity: 0.95 })
                    .bindTooltip(`${escapeHtml(nombreEst(e.nombre))}: ${numES(mm, 1)} mm en 24 h`, { direction: "right" }).addTo(capa);
            }
        } else if (!demarSinDatos(pl, e => e.t.length > 0, "p").length) h += `\n<span class="r-info">${pl.length} pluviometro${pl.length > 1 ? "s" : ""} en la cuenca, sin datos ahora.</span>`;
    } else h += `\n<span class="r-info">No hay pluviometros SAIH en la cuenca.</span>`;
    if (huecos.size) h += `\n<span style="color:#FFB74D;">${[...huecos].join(", ")}: no publica sus datos en el Observatorio del Agua (${[af?.length ? `${af.length} aforos` : "", pl?.length ? `${pl.length} pluviometros` : ""].filter(Boolean).join(" y ")} en la cuenca, sin datos).</span>`;
    h += `\n<span class="r-info" style="font-size:11px;">Fuente: SAIH de las confederaciones via Observatorio del Agua (MITECO), tiempo real sin validar. En el mapa: aforos con su caudal y pluviometros en verde.</span>`;
    sal.innerHTML = h;
}

function lastVal(chart) { return chart?.dates?.length ? chart.values[chart.values.length - 1] : null; }
function lastTime(chart) { return chart?.dates?.length ? chart.dates[chart.dates.length - 1] : null; }
function fmtTime(t) { if (!t) return ""; return new Date(t).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); }

async function buscarAforos(tipo) {
    if (!resultLayer) return;
    const btnId = "btn-aforo-" + tipo;
    document.getElementById(btnId).disabled = true;
    if (argosLayer) { map.removeLayer(argosLayer); argosLayer = null; }
    lastSaihResults = [];

    addResult(`\n\n<span class="r-label">Buscando estaciones de aforo...</span>`);
    showProgress(0, "Conectando con Argos...");

    try {
        const tk = await argosLogin();
        if (!tk) { addResult(`\n<span style="color:#ff6b6b;">Error: ${escapeHtml(msgArgos())}</span>`); return; }

        const useDownstream = lastDownstreamFeats && lastDownstreamFeats.length;
        const searchFeats = useDownstream ? lastDownstreamFeats : (lastGeoJSON?.features || []);
        const allBounds = L.latLngBounds([]);
        if (useDownstream) {
            searchFeats.forEach(f => { try { const c = f.geometry.type === "LineString" ? f.geometry.coordinates : f.geometry.coordinates.flat(); c.forEach(v => allBounds.extend([v[1], v[0]])); } catch {} });
        } else {
            allBounds.extend(resultLayer.getBounds());
        }
        if (!allBounds.isValid()) return;
        const pad = 0.05;
        const bboxStr = `${allBounds.getWest()-pad},${allBounds.getSouth()-pad},${allBounds.getEast()+pad},${allBounds.getNorth()+pad}`;

        showProgress(15, useDownstream ? "Buscando SAIH en todo el recorrido..." : "Buscando estaciones SAIH...");
        const allGauges = await argosWfs(ARGOS_PF, "river_flow", bboxStr);
        if (!allGauges.length) { addResult(`\n<span class="r-info">No se encontraron estaciones SAIH en esta zona.</span>`); return; }
        const onRiver = filterByProximity(allGauges, searchFeats, 2);
        const onIds = new Set(onRiver.map(s => s.properties.id_element));
        const inZone = allGauges.filter(s => !onIds.has(s.properties.id_element));
        argosLayer = L.layerGroup().addTo(map);
        let html = "";
        if (onRiver.length) {
            html += `\n\n<span class="r-label">En el cauce (${onRiver.length}):</span>`;
            for (let i = 0; i < onRiver.length; i++) { showProgress(20 + (i / allGauges.length) * 50, `${onRiver[i].properties.name}...`); html += await renderGauge(onRiver[i], true); }
        }
        if (inZone.length) {
            html += `\n\n<span class="r-label" style="color:#8892b0;">En la zona (${inZone.length}):</span>`;
            for (let i = 0; i < inZone.length; i++) { showProgress(70 + (i / allGauges.length) * 25, `${inZone[i].properties.name}...`); html += await renderGauge(inZone[i], false); }
        }
        if (lastSaihResults.length) html += `\n\n<a href="#" onclick="openSaihDashboard();return false" style="color:#64B5F6;font-size:12px;">Abrir dashboard SAIH en ventana</a>`;
        addResult(html);
        showProgress(100, "Completado");
        setTimeout(hideProgress, 600);

    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
    finally { hideProgress(); document.getElementById(btnId).disabled = false; }
}

async function renderGauge(st, onRiver) {
    if (onRiver === undefined) onRiver = true;
    const name = st.properties.name, elemId = st.properties.id_element, coords = st.geometry.coordinates;
    const [flowData, levelData] = await Promise.all([argosChart(ARGOS_PF, elemId), argosChart(ARGOS_PL, elemId)]);

    const flow = lastVal(flowData), level = lastVal(levelData);
    const t = fmtTime(lastTime(flowData) || lastTime(levelData));
    const thresholds = levelData?.thresholds || flowData?.thresholds || [];
    lastSaihResults.push({ name, flow, level, time: t, thresholds, alertColor: "#4CAF50", alertLevel: "" });

    let alertColor = "#4CAF50", alertLevel = "";
    if (level != null && thresholds.length) {
        for (const th of thresholds.sort((a, b) => b.value - a.value)) {
            if (level >= th.value) { alertColor = th.color; alertLevel = ` ⚠ ${th.translationTag.split(".").pop().toUpperCase()}`; break; }
        }
    }
    lastSaihResults[lastSaihResults.length - 1].alertColor = alertColor;
    lastSaihResults[lastSaihResults.length - 1].alertLevel = alertLevel;

    const marker = L.circleMarker([coords[1], coords[0]], {
        radius: onRiver ? 8 : 5, fillColor: alertColor, color: "#fff", weight: onRiver ? 2 : 1, fillOpacity: onRiver ? 0.9 : 0.5
    }).addTo(argosLayer);

    let popup = `<b>${name}</b><br>`;
    if (flow != null) popup += `Caudal: <b>${flow.toFixed(2)} m³/s</b><br>`;
    if (level != null) popup += `Nivel: <b>${level.toFixed(2)} m</b><br>`;
    if (t) popup += `<small>${t}</small>`;
    if (thresholds.length) { popup += `<br><small>Umbrales:`; thresholds.forEach(th => { popup += ` <span style="color:${th.color}">●</span>${th.value}m`; }); popup += `</small>`; }
    marker.bindPopup(popup);
    if (onRiver) {
        let tipLabel = name;
        const tipParts = [];
        if (flow != null) tipParts.push(`${flow.toFixed(1)} m³/s`);
        if (level != null) tipParts.push(`${level.toFixed(2)} m`);
        if (tipParts.length) tipLabel += ` — ${tipParts.join(" | ")}`;
        marker.bindTooltip(tipLabel, { permanent: true, direction: "right", offset: [10, 0], className: "saih-label" });
    } else {
        marker.bindTooltip(name, { permanent: false, direction: "right" });
    }

    let html = `\n\n<span style="color:${alertColor};">●</span> <b>${name}</b>${alertLevel}`;
    if (flow != null) html += `\n  Caudal: ${flow.toFixed(2)} m³/s`;
    if (level != null) html += `\n  Nivel: ${level.toFixed(2)} m`;
    if (thresholds.length) { html += `\n  <span class="r-info">Umbrales:`; thresholds.forEach(th => { html += ` <span style="color:${th.color};">●</span>${th.conditionSymbol}${th.value}m`; }); html += `</span>`; }
    if (t) html += `\n  <span class="r-info">Actualizado: ${t}</span>`;
    return html;
}

async function buscarDatosEmbalse() {

    if (argosLayer) { map.removeLayer(argosLayer); argosLayer = null; }

    try {
        const tk = await argosLogin();
        if (!tk) { addResult(`\n<span style="color:#ff6b6b;">Error: ${escapeHtml(msgArgos())}</span>`); return; }

        const bb = resultLayer.getBounds();
        const pad = 0.01;
        const bboxStr = `${bb.getWest()-pad},${bb.getSouth()-pad},${bb.getEast()+pad},${bb.getNorth()+pad}`;
        const searchName = lastGeoJSON?.features?.[0]?.properties?.nombre?.toUpperCase() || "";

        showProgress(15, "Buscando embalses...");
        let reservoirs = await argosWfs(ARGOS_PV, "reservoir_volume", bboxStr);
        if (searchName && reservoirs.length > 1) {
            const exact = reservoirs.filter(r => r.properties.name.toUpperCase().includes(searchName) || searchName.includes(r.properties.name.toUpperCase()));
            if (exact.length) reservoirs = exact;
        }

        if (!reservoirs.length) {
            addResult(`\n<span class="r-info">No se encontro este embalse en Argos.</span>`);
            return;
        }

        argosLayer = L.layerGroup().addTo(map);
        let html = `\n\n<span class="r-label">Datos del embalse (${reservoirs.length}):</span>`;
        for (let i = 0; i < reservoirs.length; i++) {
            const st = reservoirs[i], name = st.properties.name, elemId = st.properties.id_element;
            const capacity = st.properties.capacity, coords = st.geometry.coordinates;
            showProgress(20 + (i / reservoirs.length) * 70, `${name}...`);

            const [volData, lvlData, outData] = await Promise.all([
                argosChart(ARGOS_PV, elemId), argosChart(ARGOS_PLV, elemId), argosChart(ARGOS_PO, elemId)
            ]);

            const vol = lastVal(volData), lvl = lastVal(lvlData), out = lastVal(outData);
            const t = fmtTime(lastTime(volData) || lastTime(lvlData));
            const pct = (vol != null && capacity) ? (vol / capacity * 100).toFixed(1) : null;

            let fillColor = "#2196F3";
            if (pct != null) { if (pct < 25) fillColor = "#F44336"; else if (pct < 50) fillColor = "#FF9800"; else if (pct > 90) fillColor = "#0D47A1"; }

            const marker = L.circleMarker([coords[1], coords[0]], {
                radius: 10, fillColor, color: "#fff", weight: 2, fillOpacity: 0.9
            }).addTo(argosLayer);

            let popup = `<b>${name}</b><br>`;
            if (vol != null) popup += `Volumen: <b>${vol.toFixed(1)} hm³</b>`;
            if (capacity) popup += ` / ${capacity} hm³`;
            if (pct != null) popup += ` (<b>${pct}%</b>)`;
            popup += `<br>`;
            if (lvl != null) popup += `Nivel: <b>${lvl.toFixed(1)} m</b><br>`;
            if (out != null) popup += `Desembalse: <b>${out.toFixed(1)} m³/s</b><br>`;
            if (t) popup += `<small>${t}</small>`;
            marker.bindPopup(popup);
            marker.bindTooltip(name, { permanent: false, direction: "right" });

            html += `\n\n<span style="color:${fillColor};">●</span> <b>${name}</b>`;
            if (vol != null) { html += `\n  Volumen: ${vol.toFixed(1)} hm³`; if (capacity) html += ` / ${capacity} hm³`; if (pct != null) html += ` (${pct}%)`; }
            if (lvl != null) html += `\n  Nivel: ${lvl.toFixed(1)} m`;
            if (out != null) html += `\n  Desembalse: ${out.toFixed(1)} m³/s`;
            if (t) html += `\n  <span class="r-info">Actualizado: ${t}</span>`;
        }

        addResult(html);
        showProgress(100, "Completado");
        setTimeout(hideProgress, 600);

    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
    finally { hideProgress(); document.getElementById("btn-aforo-embalse").disabled = false; }
}

function openSaihDashboard() {
    if (!lastSaihResults.length) return;
    const w = window.open("", "_blank", "width=800,height=600");
    const dk = matchMedia("(prefers-color-scheme:dark)").matches;
    const bg = dk ? "#111" : "#f5f7fa", bg2 = dk ? "#1a1a1a" : "#fff", tx = dk ? "#e2e8f0" : "#1e293b", tx2 = dk ? "#94a3b8" : "#64748b", bd = dk ? "#333" : "#e2e8f0";
    let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dashboard SAIH</title><style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:${bg};color:${tx};padding:20px}
    h1{font-size:18px;margin-bottom:16px;color:${tx}}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .card{background:${bg2};border:1px solid ${bd};border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .card-name{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .card-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid ${bd}}
    .card-row:last-child{border:none}
    .card-label{color:${tx2}}.card-val{font-weight:600}
    .thresh{display:flex;gap:6px;margin-top:6px;font-size:11px;color:${tx2}}
    .thresh span{display:flex;align-items:center;gap:3px}
    .thresh-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .alert-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
    th{background:${dk?"#222":"#e8e8e8"};padding:8px 6px;text-align:center;font-weight:600;position:sticky;top:0}
    td{padding:7px 6px;text-align:center;border-bottom:1px solid ${bd}}
    </style></head><body>
    <h1>Dashboard Estaciones SAIH (${lastSaihResults.length})</h1>
    <table><tr><th>Estacion</th><th>Caudal (m³/s)</th><th>Nivel (m)</th><th>Estado</th><th>Hora</th></tr>`;
    lastSaihResults.forEach(r => {
        const alert = r.alertLevel ? `<span class="alert-tag" style="background:${r.alertColor}">${r.alertLevel.replace(" ⚠ ","")}</span>` : `<span style="color:#4CAF50">Normal</span>`;
        html += `<tr><td style="text-align:left;font-weight:600">${r.name}</td><td>${r.flow != null ? r.flow.toFixed(2) : "-"}</td><td>${r.level != null ? r.level.toFixed(2) : "-"}</td><td>${alert}</td><td style="color:${tx2}">${r.time}</td></tr>`;
    });
    html += `</table><div class="cards">`;
    lastSaihResults.forEach(r => {
        html += `<div class="card"><div class="card-name"><div class="dot" style="background:${r.alertColor}"></div>${r.name}`;
        if (r.alertLevel) html += ` <span class="alert-tag" style="background:${r.alertColor}">${r.alertLevel.replace(" ⚠ ","")}</span>`;
        html += `</div>`;
        if (r.flow != null) html += `<div class="card-row"><span class="card-label">Caudal</span><span class="card-val">${r.flow.toFixed(2)} m³/s</span></div>`;
        if (r.level != null) html += `<div class="card-row"><span class="card-label">Nivel</span><span class="card-val">${r.level.toFixed(2)} m</span></div>`;
        if (r.time) html += `<div class="card-row"><span class="card-label">Actualizado</span><span class="card-val">${r.time}</span></div>`;
        if (r.thresholds?.length) {
            html += `<div class="thresh">`;
            r.thresholds.forEach(t => { html += `<span><span class="thresh-dot" style="background:${t.color}"></span>${t.conditionSymbol}${t.value}m</span>`; });
            html += `</div>`;
        }
        html += `</div>`;
    });
    html += `</div></body></html>`;
    w.document.write(html);
    w.document.close();
}

function filterByProximity(stations, lineFeatures, maxKm) {
    if (!lineFeatures.length) return stations;
    const thresh = maxKm / 111.32;
    const allVerts = [];
    lineFeatures.forEach(f => {
        try {
            const c = f.geometry.type === "MultiLineString" ? f.geometry.coordinates.flat() : f.geometry.coordinates;
            for (let i = 0; i < c.length; i += 5) allVerts.push(c[i]);
            allVerts.push(c[c.length - 1]);
        } catch {}
    });
    if (!allVerts.length) return stations;
    return stations.filter(st => {
        const [sx, sy] = st.geometry.coordinates;
        for (const v of allVerts) {
            const dx = v[0] - sx, dy = v[1] - sy;
            if (dx * dx + dy * dy <= thresh * thresh) return true;
        }
        return false;
    });
}
