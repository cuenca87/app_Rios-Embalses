// Cuenca vertiente en un punto. opts: { tramo, titulo, mantenerMapa }
async function calcularCuencaPunto(lon, lat, opts = {}) {
    const btn = document.getElementById("btn-cuenca-punto");
    if (opts.mantenerMapa) quitarCapaCuenca(); else clearMap();
    btn.disabled = true;
    const cab = opts.titulo ? `<span class="r-name">${escapeHtml(opts.titulo)}</span>\n` : "";
    (opts.mantenerMapa ? addResult : setResult)(`${opts.mantenerMapa ? "\n\n" : ""}<span class="r-label">Calculando cuenca vertiente...</span>`);
    const box = document.getElementById("result-box"), inicio = box.innerHTML.lastIndexOf('<span class="r-label">Calculando cuenca vertiente');
    const pintar = h => { box.innerHTML = box.innerHTML.slice(0, inicio) + h; };
    try {
        showProgress(5, "Buscando el cauce mas cercano...");
        let tramo = opts.tramo, distKm = 0;
        if (!tramo) {
            const t = await tramoMasCercano(lon, lat);
            if (!t) { pintar(`<span class="r-info">No hay ningun cauce de la red de MITECO a menos de 600 m del punto. Pulse mas cerca de un rio.</span>`); return; }
            tramo = t.tramo; distKm = t.distKm;
        }
        const U = tramo.properties.cod_pfafcuen, rioU = tramo.properties.cod_pfafrio;
        showProgress(15, "Buscando las subcuencas aguas arriba...");
        const cqlArriba = pfafCqlAguasArriba(U, rioU, true);
        const [propias, rango] = await Promise.all([
            wfsUnidades(`cod_pfafcuen = '${U}'`, true),
            unidadesAguasArriba(U, rioU)
        ]);
        const arriba = rango.filter(f => !esCuencaCerrada(f.properties.cod_pfafcuen, rioU));
        const cerradas = rango.filter(f => esCuencaCerrada(f.properties.cod_pfafcuen, rioU));
        const propia = propias[0];
        if (!propia) throw new Error(`no se encontro la subcuenca del tramo ${U}`);

        // Tramo propio: hasta el punto con el MDT, o entero si no se puede
        let corte = null, avisoMdt = "";
        if (document.getElementById("chk-cuenca-mdt").checked) {
            showProgress(35, "Cortando el tramo en el punto con el MDT del IGN...");
            try { corte = await cortarTramoConMdt(propia, tramo, lon, lat); }
            catch (e) { avisoMdt = `No se pudo cortar el tramo con el MDT (${e.message}); se cuenta entero.`; }
        }
        const sr = resumenUnidades(arriba, rioU);
        const areaPropia = corte ? corte.areaKm2 : +propia.properties.area_ctr_km2;
        const area = sr.area + areaPropia;
        const punto = corte ? corte.punto : turf.nearestPointOnLine(lineasDe(tramo)[0], turf.point([lon, lat])).geometry.coordinates;

        showProgress(60, "Dibujando la cuenca...");
        let geom = null, notaGeom = "";

<span class="r-label">Rio:</span> ${escapeHtml(tramo.properties.nom_rio || "-")}${distKm > 0.05 ? ` <span class="r-info">(a ${(distKm * 1000).toFixed(0)} m del punto pulsado)</span>` : ""}
<span class="r-label">Punto de cierre:</span> ${punto[1].toFixed(5)}, ${punto[0].toFixed(5)}${cotaPunto != null ? ` · ${cotaPunto.toFixed(0)} m` : ""}

  tramo hasta el punto: ${fmtKm2(areaPropia)} km² ${corte ? `(MDT ${corte.celda} m, ${(corte.fraccion * 100).toFixed(0)} % de su subcuenca)` : "(subcuenca completa del tramo)"}</span>

// Cuenca vertiente de un embalse: se cierra en el tramo de rio mas aguas abajo
// que cruza el embalse, en su ultimo punto dentro del vaso (aprox. la presa).
async function cuencaEmbalse() {
    if (!lastEmbalseFeats) return;
    const btn = document.getElementById("btn-cuenca-embalse");
    btn.disabled = true;
    try {
        showProgress(5, "Buscando los cauces del embalse...");
        const b = turf.bbox(turf.featureCollection(lastEmbalseFeats));
        const cand = await fetchBbox(OGC_SUBTRAMOS, b.join(","), PAGE_LIMIT);
        const dentro = cand.filter(t => t.properties?.cod_pfafcuen && lastEmbalseFeats.some(e => { try { return turf.booleanIntersects(t, e); } catch { return false; } }));
        if (!dentro.length) { addResult(`\n\n<span class="r-info">Ningun cauce de MITECO cruza este embalse.</span>`); return; }
        let tramo = dentro[0], maxN = -1;
        for (const t of dentro) {
            const n = dentro.filter(o => pfafEstaAguasArriba(o.properties.cod_pfafcuen, t.properties.cod_pfafcuen, t.properties.cod_pfafrio)).length;
            if (n > maxN) { maxN = n; tramo = t; }
        }
        const vert = lineasDe(tramo).flatMap(l => l.geometry.coordinates)
            .filter(c => lastEmbalseFeats.some(e => { try { return turf.booleanPointInPolygon(turf.point(c), e); } catch { return false; } }));
        // Los tramos van de nacimiento a desembocadura: el ultimo vertice dentro
        // del vaso es el mas proximo a la presa (sobre el agua el MDT es plano).
        let cierre;
        if (vert.length) {
            cierre = vert[vert.length - 1];
        } else {
            cierre = turf.nearestPointOnLine(lineasDe(tramo)[0], turf.centroid(turf.featureCollection(lastEmbalseFeats))).geometry.coordinates;
        }
        const nombre = lastEmbalseFeats[0].properties?.nombre || "embalse";
        await calcularCuencaPunto(cierre[0], cierre[1], { tramo, titulo: `Cuenca vertiente de ${nombre}`, mantenerMapa: true });
    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${escapeHtml(e.message)}</span>`); }
    finally { hideProgress(); btn.disabled = false; }
}

// --- Lluvia estimada por radar (OPERA) ---
// Compuesto europeo OPERA NIMBUS de lluvia acumulada en 1 h (EUMETNET, CC BY 4.0):
// mm en celdas de 2 km (LAEA), uno nuevo cada 15 min (~12 min despues del final
// de la hora) y se guardan 24 h. Incluye 10 de los 15 radares de AEMET, ademas
// de los de Portugal y Francia. Se lee a traves del proxy, que reenvia los rangos.
// Se descargan una vez las 24 horas de la ventana de la Peninsula y Baleares
// (4 teselas del GeoTIFF, ~225 KB por hora sin lluvia) y con eso se pinta la capa
// del mapa y se calcula la lluvia de cualquier cuenca. Canarias queda fuera de OPERA.
const OPERA_PROXY = MITECO_PROXY + "opera/";
const OPERA_NODATA = -9999000;                 // sin cobertura (NaN en el GeoTIFF = hay radar y no llueve)
const LLUVIA_HORAS = 24;
const LLUVIA_VENTANA = [90, 1550, 760, 2110];  // columnas/filas de la rejilla OPERA
const LLUVIA_SIN = 65535;                      // datos en centesimas de mm (Uint16); este valor = sin cobertura
let cuencaActual = null;   // { geom } de la ultima cuenca dibujada
let lluviaCarga = null;    // { p: Promise de los datos, t: cuando se pidieron }

const pad2 = n => String(n).padStart(2, "0");
function operaUrl(fin) {   // fin: Date (UTC) del final del acumulado
    const d = `${fin.getUTCFullYear()}${pad2(fin.getUTCMonth() + 1)}${pad2(fin.getUTCDate())}`;
    return `${OPERA_PROXY}${d.slice(0, 4)}/${d.slice(4, 6)}/${d.slice(6)}/OPERA/COMP/OPERA@${d}T${pad2(fin.getUTCHours())}${pad2(fin.getUTCMinutes())}@0@ACRR.tiff`;
}
async function abrirOpera(fin, intentos = 2) {
    for (let k = 0; k < intentos; k++) {
        try { return await (await GeoTIFF.fromUrl(operaUrl(fin), { allowFullFile: false })).getImage(); }
        catch { }   // aun no publicado, ya borrado (solo hay 24 h) o fallo de red
    }
    return null;
}
const horaLocal = d => d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

// Ultimas 24 h de lluvia (una vez; se vuelven a pedir pasados 10 min)
function cargarLluvia(progreso) {
    if (lluviaCarga && Date.now() - lluviaCarga.t < 10 * 60000) return lluviaCarga.p;
    const p = (async () => {
        await cargarLibsMdt();
        proj4.defs("OPERA", "+proj=laea +lat_0=55 +lon_0=10 +x_0=1950000 +y_0=-2100000 +ellps=WGS84 +units=m +no_defs");
        // Ultimo compuesto publicado: se prueba hacia atras de 15 en 15 min
        let fin = new Date(Math.floor((Date.now() - 10 * 60000) / 900000) * 900000), img = null;
        for (let k = 0; k < 6 && !img; k++) { img = await abrirOpera(fin, 1); if (!img) fin = new Date(fin - 900000); }
        if (!img) throw new Error("no hay compuestos de OPERA disponibles");
        const [c0, f0, c1, f1] = LLUVIA_VENTANA, W = c1 - c0, H = f1 - f0;
        // Acumulados horarios que no se solapan: fin, fin-1h, ..., fin-23h
        const fines = Array.from({ length: LLUVIA_HORAS }, (_, i) => new Date(fin - i * 3600000));
        const horas = new Array(LLUVIA_HORAS);
        let hechas = 0, sig = 0;
        const trabajador = async () => {
            while (sig < fines.length) {
                const i = sig++;
                const im = i === 0 ? img : await abrirOpera(fines[i]);
                let v = null;
                if (im) {
                    try {
                        const [r] = await im.readRasters({ window: LLUVIA_VENTANA, samples: [0] });
                        v = new Uint16Array(W * H);
                        for (let k = 0; k < v.length; k++) {
                            const x = r[k];
                            v[k] = x === OPERA_NODATA ? LLUVIA_SIN : x > 0 ? Math.min(65534, Math.round(x * 100)) : 0;
                        }
                    } catch { v = null; }
                }
                horas[LLUVIA_HORAS - 1 - i] = { fin: fines[i], v };
                progreso?.(++hechas, LLUVIA_HORAS);
            }
        };
        await Promise.all(Array.from({ length: 6 }, trabajador));
        const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
        return { fin, horas, W, H, ox: ox + c0 * rx, oy: oy + f0 * ry, rx, ry };
    })();
    lluviaCarga = { p, t: Date.now() };
    p.catch(() => { lluviaCarga = null; });
    return p;
}
// Celda de la ventana que contiene un punto (o -1)
function celdaLluvia(d, lon, lat) {
    const [x, y] = proj4("EPSG:4326", "OPERA", [lon, lat]);
    const c = Math.floor((x - d.ox) / d.rx), f = Math.floor((y - d.oy) / d.ry);
    return c < 0 || f < 0 || c >= d.W || f >= d.H ? -1 : f * d.W + c;
}
// Acumulado de las ultimas h horas en una celda (mm; null si ninguna hora tiene cobertura)
function acumCelda(d, k, h) {
    let s = 0, ok = false;
    for (let i = LLUVIA_HORAS - h; i < LLUVIA_HORAS; i++) {
        const v = d.horas[i].v;
        if (!v || v[k] === LLUVIA_SIN) continue;
        s += v[k]; ok = true;
    }
    return ok ? s / 100 : null;
}

// Celdas cuyo centro cae dentro de la cuenca (o la que contiene el centroide,
// si la cuenca es menor que una celda)
function celdasCuenca(d, geom) {
    const [w, s, e, n] = turf.bbox(geom);
    const esq = [[w, s], [w, n], [e, s], [e, n], [(w + e) / 2, s], [(w + e) / 2, n], [w, (s + n) / 2], [e, (s + n) / 2]]
        .map(c => proj4("EPSG:4326", "OPERA", c));
    const col = x => Math.floor((x - d.ox) / d.rx), fil = y => Math.floor((y - d.oy) / d.ry);
    const c0 = Math.max(0, Math.min(...esq.map(p => col(p[0]))) - 1), c1 = Math.min(d.W - 1, Math.max(...esq.map(p => col(p[0]))) + 1);
    const f0 = Math.max(0, Math.min(...esq.map(p => fil(p[1]))) - 1), f1 = Math.min(d.H - 1, Math.max(...esq.map(p => fil(p[1]))) + 1);
    if (c0 > c1 || f0 > f1) return null;
    // Para el punto-en-poligono basta un contorno simplificado (~200 m)
    const polis = (geom.type === "FeatureCollection" ? geom.features : [geom])
        .map(f => turf.simplify(turf.feature(f.geometry || f), { tolerance: 0.002, highQuality: false }));
    const dentro = [];
    for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) {
        const pt = turf.point(proj4("OPERA", "EPSG:4326", [d.ox + (c + 0.5) * d.rx, d.oy + (f + 0.5) * d.ry]));
        if (polis.some(p => turf.booleanPointInPolygon(pt, p))) dentro.push(f * d.W + c);
    }
    if (dentro.length) return { dentro, centroide: false };
    const k = celdaLluvia(d, ...turf.centroid(geom).geometry.coordinates);
    return k < 0 ? null : { dentro: [k], centroide: true };
}
function lluviaHora(v, celdas) {
    if (!v) return { media: null, max: 0, cobertura: 0 };
    let suma = 0, max = 0, cubiertas = 0;
    for (const k of celdas.dentro) {
        if (v[k] === LLUVIA_SIN) continue;
        const mm = v[k] / 100;
        suma += mm; cubiertas++; if (mm > max) max = mm;
    }
    return { media: cubiertas ? suma / cubiertas : null, max, cobertura: cubiertas / celdas.dentro.length };
}
// Grafico de barras de las ultimas horas (media sobre la cuenca, mm/h)
function graficoLluvia(serie) {
    const W = 320, H = 110, m = { l: 26, r: 6, t: 8, b: 18 }, n = serie.length;
    const vmax = Math.max(1, ...serie.map(s => s.media || 0)), bw = (W - m.l - m.r) / n;
    const y = v => m.t + (H - m.t - m.b) * (1 - v / vmax);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin-top:4px;" font-size="9" fill="#8892b0">`;
    svg += `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="#0f3460"/>`;
    [0, vmax / 2, vmax].forEach(v => svg += `<text x="${m.l - 3}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(v < 10 && v % 1 ? 1 : 0)}</text>`);
    serie.forEach((s, i) => {
        const x = m.l + i * bw;
        if (s.media == null) svg += `<rect x="${x + 1}" y="${m.t}" width="${bw - 2}" height="${H - m.t - m.b}" fill="#ffffff" opacity="0.05"><title>${s.etiqueta}: sin datos</title></rect>`;
        else svg += `<rect x="${x + 1}" y="${y(s.media)}" width="${Math.max(bw - 2, 1)}" height="${H - m.b - y(s.media)}" fill="#29B6F6"><title>${s.etiqueta}: ${fmtMm(s.media)} mm (max ${fmtMm(s.max)})</title></rect>`;
        if (i % 6 === (n - 1) % 6) svg += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${s.hora}</text>`;
    });
    return svg + "</svg>";
}
const fmtMm = v => v == null ? "-" : v === 0 ? "0" : v < 0.05 ? "<0,1" : v < 10 ? v.toFixed(1).replace(".", ",") : v.toFixed(0);
// Volumen caido sobre la cuenca: 1 mm sobre 1 km² = 1.000 m³ = 1 millon de litros
// Numero en español con punto de miles tambien en las cifras de 4 digitos (toLocaleString no lo pone)
function numES(v, dec = 0) {
    const [e, d] = v.toFixed(dec).split(".");
    return e.replace(/\B(?=(\d{3})+$)/g, ".") + (d && +d ? "," + d.replace(/0+$/, "") : "");
}
function fmtVolumen(mm, km2) {
    const m3 = mm * km2 * 1000;
    if (!(m3 > 0)) return "";
    const vol = m3 >= 1e6 ? `${numES(m3 / 1e6, m3 < 1e7 ? 2 : m3 < 1e8 ? 1 : 0)} hm³` : `${numES(m3)} m³`;
    const l = m3 * 1000;
    const lit = l >= 1e12 ? `${numES(l / 1e12, 2)} billones de litros` : l >= 1e9 ? `${numES(Math.round(l / 1e7) * 10)} millones de litros`
        : l >= 1e6 ? `${numES(l / 1e6, l < 1e7 ? 1 : 0)} millones de litros` : `${numES(l)} litros`;
    return `${vol} · ${lit}`;
}

async function lluviaRadarCuenca(boton) {
    if (!cuencaActual) return;
    const { geom } = cuencaActual;
    if (boton) boton.disabled = true;
    const salida = document.createElement("span");
    boton?.insertAdjacentElement("afterend", salida);
    const escribir = h => { salida.innerHTML = h; };
    escribir(`\n<span class="r-info">Leyendo el radar...</span>`);
    try {
        const d = await cargarLluvia((n, t) => escribir(`\n<span class="r-info">Leyendo el radar... ${n}/${t} h</span>`));
        const celdas = celdasCuenca(d, geom);
        if (!celdas) throw new Error("la cuenca queda fuera del compuesto de OPERA (no incluye Canarias)");
        const serie = d.horas.map(hh => {
            const loc = horaLocal(hh.fin);
            return { ...lluviaHora(hh.v, celdas), hora: loc, etiqueta: `Hasta las ${loc}` };
        });
        const ult = serie[LLUVIA_HORAS - 1];
        const acum = h => {
            const tramo = serie.slice(-h), ok = tramo.filter(s => s.media != null);
            return { mm: ok.reduce((a, s) => a + s.media, 0), faltan: h - ok.length };
        };
        const finTxt = d.fin.toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        const km2 = cuencaActual.areaKm2 || turf.area(geom) / 1e6;
        const filas = [1, 3, 6, 12, 24].map(h => {
            const a = acum(h), vol = fmtVolumen(a.mm, km2);

// --- Capa de lluvia acumulada en el mapa ---
const LLUVIA_ESCALA = [   // [desde mm, color]
    [0.1, "#b3e5fc"], [0.5, "#81d4fa"], [1, "#4fc3f7"], [2, "#29b6f6"], [5, "#1e88e5"], [10, "#43a047"],
    [20, "#fdd835"], [30, "#fb8c00"], [50, "#e53935"], [75, "#c2185b"], [100, "#8e24aa"], [150, "#4a148c"]
].map(([v, c]) => [v, [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]]);
const LLUVIA_BOUNDS = [[35.4, -10.0], [44.4, 5.0]];   // lat/lon de la imagen (Peninsula y Baleares)
const LLUVIA_ANCHO = 900;                            // px (~1,6 km)
let lluviaCapa = null, lluviaLeyenda = null, lluviaHorasSel = 24, lluviaLut = null;

// Para cada pixel de la imagen (Web Mercator), la celda OPERA que le toca
function lutLluvia(d) {
    if (lluviaLut) return lluviaLut;
    const [[s, w], [n, e]] = LLUVIA_BOUNDS, merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
    const W = LLUVIA_ANCHO, H = Math.round(W * (merc(n) - merc(s)) / ((e - w) * Math.PI / 180));
    const idx = new Int32Array(W * H);
    for (let j = 0; j < H; j++) {
        const lat = Math.atan(Math.sinh(merc(n) - (j + 0.5) / H * (merc(n) - merc(s)))) * 180 / Math.PI;
        for (let i = 0; i < W; i++) idx[j * W + i] = celdaLluvia(d, w + (i + 0.5) / W * (e - w), lat);
    }
    return (lluviaLut = { W, H, idx });
}
function imagenLluvia(d, h) {
    const { W, H, idx } = lutLluvia(d);
    const acc = new Float32Array(d.W * d.H).fill(-1);    // -1 = sin cobertura
    for (let i = LLUVIA_HORAS - h; i < LLUVIA_HORAS; i++) {
        const v = d.horas[i].v;
        if (!v) continue;
        for (let k = 0; k < v.length; k++) if (v[k] !== LLUVIA_SIN) acc[k] = (acc[k] < 0 ? 0 : acc[k]) + v[k] / 100;
    }

    const ctx = cv.getContext("2d"), im = ctx.createImageData(W, H), px = im.data;
    let maxMm = 0;
    for (let p = 0; p < W * H; p++) {
        const k = idx[p];
        if (k < 0) continue;
        const mm = acc[k];
        if (mm < 0) { px[4 * p] = px[4 * p + 1] = px[4 * p + 2] = 90; px[4 * p + 3] = 40; continue; }   // sin cobertura
        if (mm < LLUVIA_ESCALA[0][0]) continue;
        if (mm > maxMm) maxMm = mm;
        let c = LLUVIA_ESCALA[0][1];
        for (const [v, col] of LLUVIA_ESCALA) if (mm >= v) c = col;
        px[4 * p] = c[0]; px[4 * p + 1] = c[1]; px[4 * p + 2] = c[2]; px[4 * p + 3] = 235;
    }
    ctx.putImageData(im, 0, 0);
    return { url: cv.toDataURL("image/png"), maxMm };
}

    const bts = [1, 3, 6, 12, 24].map(h => `<button data-h="${h}" class="${h === lluviaHorasSel ? "on" : ""}">${h} h</button>`).join("");
    const esc = LLUVIA_ESCALA.map(([v, c]) => `<span style="background:rgb(${c})" title="desde ${v} mm"></span>`).join("");
    const lab = LLUVIA_ESCALA.map(([v]) => `<i>${v}</i>`).join("");
    return `<b>🌧️ Lluvia por radar (mm)</b><div class="ll-bts">${bts}</div><div class="ll-esc">${esc}</div><div class="ll-lab">${lab}</div>
<div class="ll-est">${estado}</div><div class="ll-fuente"><span class="ll-sin"></span> sin cobertura · OPERA/EUMETNET (AEMET), CC BY 4.0 · Canarias no incluida</div>`;

    } catch (e) { est(`<span style="color:#ff6b6b">No se pudo leer el radar: ${escapeHtml(e.message)}</span>`); }
}

// --- CERCA DE MI: geolocalizacion + rios/embalses mas proximos ---
async function buscarCercanos() {
    clearMap();
    document.getElementById("info-banner").style.display = "none";
    document.getElementById("btn-cerca").disabled = true;
    setResult(`<span class="r-info">Obteniendo ubicacion...</span>`);
    if (!navigator.geolocation) {
        setResult(`<span style="color:#ff6b6b;">Su navegador no soporta geolocalizacion.</span>`);
        document.getElementById("btn-cerca").disabled = false;
        return;
    }
    navigator.geolocation.getCurrentPosition(async pos => {
        try {
            const lon = pos.coords.longitude, lat = pos.coords.latitude, acc = pos.coords.accuracy;
            const userPt = turf.point([lon, lat]);
            lastCercaPt = [lon, lat];
            userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Mi ubicacion").openPopup();
            userAccCircle = L.circle([lat, lon], { radius: acc, color:"#64B5F6", fillOpacity:0.08, weight:1 }).addTo(map);
            map.setView([lat, lon], 12);

            setResult(`<span class="r-info">Buscando rios y embalses cercanos...</span>`);
            showProgress(10, "Buscando en la zona...");

            // Amplia el radio de busqueda si en la primera pasada no hay suficientes resultados
            // (zonas rurales con pocos cauces/embalses cercanos)
            // Rios (MITECO) y embalses (IGN) son servicios distintos: si uno falla,
            // se sigue con el otro y se avisa, en vez de abortar toda la busqueda.
            let deg = 0.05, riverGroups = new Map(), embGroups = new Map();
            const fallos = new Set();
            for (let attempt = 0; attempt < 4; attempt++) {
                const bbox = `${lon-deg},${lat-deg},${lon+deg},${lat+deg}`;
                showProgress(10 + attempt*18, `Buscando en un radio de ~${Math.round(deg*111)} km...`);
                const [rRios, rEmb] = await Promise.allSettled([
                    fetchBbox(OGC_RIOS, bbox, PAGE_LIMIT),
                    fetchBbox(OGC_EMBALSES, bbox, 200)
                ]);
                if (rRios.status === "rejected") { fallos.add("rios (MITECO)"); console.error("Cerca de mi - rios:", rRios.reason); }
                if (rEmb.status === "rejected") { fallos.add("embalses (IGN)"); console.error("Cerca de mi - embalses:", rEmb.reason); }
                if (fallos.size === 2) throw new Error("No responden los servicios de rios ni de embalses. Intentelo de nuevo en unos minutos.");
                const riverFeats = rRios.status === "fulfilled" ? rRios.value : [];
                const embFeats = rEmb.status === "fulfilled" ? rEmb.value : [];
                riverGroups = new Map();
                riverFeats.forEach(f => {
                    const name = f.properties?.nom_rio; if (!name) return;
                    let d; try { d = turf.pointToLineDistance(userPt, f, {units:"kilometers"}); } catch { return; }
                    if (!riverGroups.has(name) || d < riverGroups.get(name).d) riverGroups.set(name, {d, feat:f});
                });
                embGroups = new Map();
                embFeats.forEach(f => {
                    const name = f.properties?.nombre; if (!name) return;
                    let d;
                    try {
                        d = turf.booleanPointInPolygon(userPt, f) ? 0 : turf.pointToLineDistance(userPt, turf.polygonToLine(f), {units:"kilometers"});
                    } catch { return; }
                    if (!embGroups.has(name) || d < embGroups.get(name).d) embGroups.set(name, {d, feat:f});
                });
                const okRios = fallos.has("rios (MITECO)") || riverGroups.size >= 5;
                const okEmb = fallos.has("embalses (IGN)") || embGroups.size >= 3;
                if (okRios && okEmb) break;
                deg *= 2.2;
            }
            hideProgress();

            const rivers = [...riverGroups.entries()].sort((a,b) => a[1].d - b[1].d).slice(0, 6);
            const embalses = [...embGroups.entries()].sort((a,b) => a[1].d - b[1].d).slice(0, 6);

            if (!rivers.length && !embalses.length) {
                setResult(`<span class="r-info">No se encontraron rios ni embalses en un radio de ~${Math.round(deg*111)} km.</span>`);
                return;
            }

            let html = `<span class="r-name">Cerca de su ubicacion</span>\n<span class="r-info">lon=${lon.toFixed(5)}, lat=${lat.toFixed(5)} (precision ~${Math.round(acc)} m)</span>\n`;
            if (fallos.size) html += `\n<span style="color:#ffb74d;">Aviso: no ha respondido el servicio de ${[...fallos].join(" ni el de ")}; se muestran solo los resultados disponibles.</span>\n`;
            if (rivers.length) {
                html += `\n<span class="r-label">Rios mas proximos (click para ver detalle):</span>`;
                rivers.forEach(([name, {d}]) => {
                    html += `\n<span class="r-cerca-item" data-type="rio" data-name="${escapeHtml(name)}" style="cursor:pointer;color:#00BCD4;text-decoration:underline;">${name}</span> <span class="r-info">(${d.toFixed(1)} km)</span>`;
                });
            }
            if (embalses.length) {
                html += `\n\n<span class="r-label">Embalses mas proximos (click para ver detalle):</span>`;
                embalses.forEach(([name, {d}]) => {
                    html += `\n<span class="r-cerca-item" data-type="embalse" data-name="${escapeHtml(name)}" style="cursor:pointer;color:#2196F3;text-decoration:underline;">${name}</span> <span class="r-info">(${d===0?"aqui mismo":d.toFixed(1)+" km"})</span>`;
                });
            }
            setResult(html);

            // Vista previa en el mapa (lineas/poligonos finos) sin necesidad de hacer click.
            // No se hace fitBounds a todos los resultados: el mas lejano puede estar a
            // bastantes km y dejaria el mapa demasiado alejado para ver los mas cercanos
            // (que son los relevantes de un vistazo). Se mantiene el zoom fijo sobre la
            // ubicacion del usuario; cada item sigue siendo clicable para ir a el.
            cercaLayer = L.layerGroup().addTo(map);
            rivers.forEach(([name, {feat}], i) => {
                L.geoJSON(feat, { style:{ color:"#00BCD4", weight: i===0?3:2, opacity:0.7, dashArray: i===0?null:"4 4" } }).addTo(cercaLayer);
            });
            embalses.forEach(([name, {feat}]) => {
                L.geoJSON(feat, { style:{ color:"#2196F3", weight:1.5, fillColor:"#2196F3", fillOpacity:0.25 } }).addTo(cercaLayer);
            });

        } catch (e) { setResult(`<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
        finally { hideProgress(); document.getElementById("btn-cerca").disabled = false; }
    }, err => {
        const m = {1:"Permiso denegado.",2:"Ubicacion no disponible.",3:"Tiempo agotado."};
        setResult(`<span style="color:#ff6b6b;">${m[err.code]||"Error."}</span>`);
        document.getElementById("btn-cerca").disabled = false;
    }, { enableHighAccuracy:true, timeout:15000 });
}

// --- Argos Hydro: estaciones de aforo y embalses ---
// La API real de Argos no tiene CORS habilitado, así que no se puede llamar
// directamente desde una web estática (GitHub Pages). ARGOS_BASE apunta a un
// Cloudflare Worker propio que solo reenvía la petición añadiendo las
// cabeceras CORS (código en argos-proxy-worker/worker.js) — funciona igual
// en local que en producción, sin depender de server.js.
const ARGOS_BASE = "https://argos-hydro-proxy.riosyembalses.workers.dev";
const ARGOS_API = ARGOS_BASE + "/api";
const ARGOS_WFS = ARGOS_BASE + "/geoserver/wfs";
let argosToken = null, argosLayer = null, lastSaihResults = [];

async function argosLogin() {
    if (argosToken) return argosToken;
    try {
        const r = await fetch(`${ARGOS_API}/Authorization`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: "Brcuenca", password: "MamaPato25" })
        });
        if (!r.ok) return null;
        argosToken = (await r.json()).accessToken;
        return argosToken;
    } catch { return null; }
}

async function argosChart(productId, elementId) {
    const tk = await argosLogin();
    if (!tk) return null;
    try {
        const r = await fetch(`${ARGOS_API}/Map/chart/product/${productId}/element/${elementId}`, { headers: { Authorization: `Bearer ${tk}` } });
        if (!r.ok) return null;
        return await r.json();
    } catch { return null; }
}

async function argosWfs(productId, iconType, bbox) {
    const tk = await argosLogin();
    if (!tk) return [];
    try {
        const url = `${ARGOS_WFS}?service=WFS&version=2.0.0&request=GetFeature&typeNames=argos:sensors&outputFormat=application/json&count=5000&viewParams=id_account:${ARGOS_ACCOUNT};id_product:${productId};icon_type:${iconType};icon_format:png;feature_type:product_sensors&bbox=${bbox},EPSG:4326`;
        const r = await fetch(url, { headers: { Authorization: `Bearer ${tk}` } });
        if (!r.ok) return [];
        return (await r.json()).features || [];
    } catch { return []; }
}

function lastVal(chart) { return chart?.dates?.length ? chart.values[chart.values.length - 1] : null; }
function lastTime(chart) { return chart?.dates?.length ? chart.dates[chart.dates.length - 1] : null; }
function fmtTime(t) { if (!t) return ""; return new Date(t).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); }

async function buscarAforos(tipo) {
    if (!resultLayer) return;
    const btnId = "btn-aforo-" + tipo;
    document.getElementById(btnId).disabled = true;
    if (argosLayer) { map.removeLayer(argosLayer); argosLayer = null; }
    lastSaihResults = [];

    addResult(`\n\n<span class="r-label">Buscando estaciones de aforo...</span>`);
    showProgress(0, "Conectando con Argos...");

    try {
        const tk = await argosLogin();
        if (!tk) { addResult(`\n<span style="color:#ff6b6b;">Error: no se pudo conectar con Argos</span>`); return; }

        const useDownstream = lastDownstreamFeats && lastDownstreamFeats.length;
        const searchFeats = useDownstream ? lastDownstreamFeats : (lastGeoJSON?.features || []);
        const allBounds = L.latLngBounds([]);
        if (useDownstream) {
            searchFeats.forEach(f => { try { const c = f.geometry.type === "LineString" ? f.geometry.coordinates : f.geometry.coordinates.flat(); c.forEach(v => allBounds.extend([v[1], v[0]])); } catch {} });
        } else {
            allBounds.extend(resultLayer.getBounds());
        }
        if (!allBounds.isValid()) return;
        const pad = 0.05;
        const bboxStr = `${allBounds.getWest()-pad},${allBounds.getSouth()-pad},${allBounds.getEast()+pad},${allBounds.getNorth()+pad}`;

        showProgress(15, useDownstream ? "Buscando SAIH en todo el recorrido..." : "Buscando estaciones SAIH...");
        const allGauges = await argosWfs(ARGOS_PF, "river_flow", bboxStr);
        if (!allGauges.length) { addResult(`\n<span class="r-info">No se encontraron estaciones SAIH en esta zona.</span>`); return; }
        const onRiver = filterByProximity(allGauges, searchFeats, 2);
        const onIds = new Set(onRiver.map(s => s.properties.id_element));
        const inZone = allGauges.filter(s => !onIds.has(s.properties.id_element));
        argosLayer = L.layerGroup().addTo(map);
        let html = "";
        if (onRiver.length) {
            html += `\n\n<span class="r-label">En el cauce (${onRiver.length}):</span>`;
            for (let i = 0; i < onRiver.length; i++) { showProgress(20 + (i / allGauges.length) * 50, `${onRiver[i].properties.name}...`); html += await renderGauge(onRiver[i], true); }
        }
        if (inZone.length) {
            html += `\n\n<span class="r-label" style="color:#8892b0;">En la zona (${inZone.length}):</span>`;
            for (let i = 0; i < inZone.length; i++) { showProgress(70 + (i / allGauges.length) * 25, `${inZone[i].properties.name}...`); html += await renderGauge(inZone[i], false); }
        }
        if (lastSaihResults.length) html += `\n\n<a href="#" onclick="openSaihDashboard();return false" style="color:#64B5F6;font-size:12px;">Abrir dashboard SAIH en ventana</a>`;
        addResult(html);
        showProgress(100, "Completado");
        setTimeout(hideProgress, 600);

    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
    finally { hideProgress(); document.getElementById(btnId).disabled = false; }
}

async function renderGauge(st, onRiver) {
    if (onRiver === undefined) onRiver = true;
    const name = st.properties.name, elemId = st.properties.id_element, coords = st.geometry.coordinates;
    const [flowData, levelData] = await Promise.all([argosChart(ARGOS_PF, elemId), argosChart(ARGOS_PL, elemId)]);

    const flow = lastVal(flowData), level = lastVal(levelData);
    const t = fmtTime(lastTime(flowData) || lastTime(levelData));
    const thresholds = levelData?.thresholds || flowData?.thresholds || [];
    lastSaihResults.push({ name, flow, level, time: t, thresholds, alertColor: "#4CAF50", alertLevel: "" });

    let alertColor = "#4CAF50", alertLevel = "";
    if (level != null && thresholds.length) {
        for (const th of thresholds.sort((a, b) => b.value - a.value)) {
            if (level >= th.value) { alertColor = th.color; alertLevel = ` ⚠ ${th.translationTag.split(".").pop().toUpperCase()}`; break; }
        }
    }
    lastSaihResults[lastSaihResults.length - 1].alertColor = alertColor;
    lastSaihResults[lastSaihResults.length - 1].alertLevel = alertLevel;

    const marker = L.circleMarker([coords[1], coords[0]], {
        radius: onRiver ? 8 : 5, fillColor: alertColor, color: "#fff", weight: onRiver ? 2 : 1, fillOpacity: onRiver ? 0.9 : 0.5
    }).addTo(argosLayer);

    let popup = `<b>${name}</b><br>`;
    if (flow != null) popup += `Caudal: <b>${flow.toFixed(2)} m³/s</b><br>`;
    if (level != null) popup += `Nivel: <b>${level.toFixed(2)} m</b><br>`;
    if (t) popup += `<small>${t}</small>`;
    if (thresholds.length) { popup += `<br><small>Umbrales:`; thresholds.forEach(th => { popup += ` <span style="color:${th.color}">●</span>${th.value}m`; }); popup += `</small>`; }
    marker.bindPopup(popup);
    if (onRiver) {
        let tipLabel = name;
        const tipParts = [];
        if (flow != null) tipParts.push(`${flow.toFixed(1)} m³/s`);
        if (level != null) tipParts.push(`${level.toFixed(2)} m`);
        if (tipParts.length) tipLabel += ` — ${tipParts.join(" | ")}`;
        marker.bindTooltip(tipLabel, { permanent: true, direction: "right", offset: [10, 0], className: "saih-label" });
    } else {
        marker.bindTooltip(name, { permanent: false, direction: "right" });
    }

    let html = `\n\n<span style="color:${alertColor};">●</span> <b>${name}</b>${alertLevel}`;
    if (flow != null) html += `\n  Caudal: ${flow.toFixed(2)} m³/s`;
    if (level != null) html += `\n  Nivel: ${level.toFixed(2)} m`;
    if (thresholds.length) { html += `\n  <span class="r-info">Umbrales:`; thresholds.forEach(th => { html += ` <span style="color:${th.color};">●</span>${th.conditionSymbol}${th.value}m`; }); html += `</span>`; }
    if (t) html += `\n  <span class="r-info">Actualizado: ${t}</span>`;
    return html;
}

async function buscarDatosEmbalse() {
    if (!resultLayer) return;
    document.getElementById("btn-aforo-embalse").disabled = true;
    if (argosLayer) { map.removeLayer(argosLayer); argosLayer = null; }

    addResult(`\n\n<span class="r-label">Buscando datos del embalse...</span>`);
    showProgress(0, "Conectando con Argos...");

    try {
        const tk = await argosLogin();
        if (!tk) { addResult(`\n<span style="color:#ff6b6b;">Error: no se pudo conectar con Argos</span>`); return; }

        const bb = resultLayer.getBounds();
        const pad = 0.01;
        const bboxStr = `${bb.getWest()-pad},${bb.getSouth()-pad},${bb.getEast()+pad},${bb.getNorth()+pad}`;
        const searchName = lastGeoJSON?.features?.[0]?.properties?.nombre?.toUpperCase() || "";

        showProgress(15, "Buscando embalses...");
        let reservoirs = await argosWfs(ARGOS_PV, "reservoir_volume", bboxStr);
        if (searchName && reservoirs.length > 1) {
            const exact = reservoirs.filter(r => r.properties.name.toUpperCase().includes(searchName) || searchName.includes(r.properties.name.toUpperCase()));
            if (exact.length) reservoirs = exact;
        }

        if (!reservoirs.length) {
            addResult(`\n<span class="r-info">No se encontro este embalse en Argos.</span>`);
            return;
        }

        argosLayer = L.layerGroup().addTo(map);
        let html = `\n\n<span class="r-label">Datos del embalse (${reservoirs.length}):</span>`;
        for (let i = 0; i < reservoirs.length; i++) {
            const st = reservoirs[i], name = st.properties.name, elemId = st.properties.id_element;
            const capacity = st.properties.capacity, coords = st.geometry.coordinates;
            showProgress(20 + (i / reservoirs.length) * 70, `${name}...`);

            const [volData, lvlData, outData] = await Promise.all([
                argosChart(ARGOS_PV, elemId), argosChart(ARGOS_PLV, elemId), argosChart(ARGOS_PO, elemId)
            ]);

            const vol = lastVal(volData), lvl = lastVal(lvlData), out = lastVal(outData);
            const t = fmtTime(lastTime(volData) || lastTime(lvlData));
            const pct = (vol != null && capacity) ? (vol / capacity * 100).toFixed(1) : null;

            let fillColor = "#2196F3";
            if (pct != null) { if (pct < 25) fillColor = "#F44336"; else if (pct < 50) fillColor = "#FF9800"; else if (pct > 90) fillColor = "#0D47A1"; }

            const marker = L.circleMarker([coords[1], coords[0]], {
                radius: 10, fillColor, color: "#fff", weight: 2, fillOpacity: 0.9
            }).addTo(argosLayer);

            let popup = `<b>${name}</b><br>`;
            if (vol != null) popup += `Volumen: <b>${vol.toFixed(1)} hm³</b>`;
            if (capacity) popup += ` / ${capacity} hm³`;
            if (pct != null) popup += ` (<b>${pct}%</b>)`;
            popup += `<br>`;
            if (lvl != null) popup += `Nivel: <b>${lvl.toFixed(1)} m</b><br>`;
            if (out != null) popup += `Desembalse: <b>${out.toFixed(1)} m³/s</b><br>`;
            if (t) popup += `<small>${t}</small>`;
            marker.bindPopup(popup);
            marker.bindTooltip(name, { permanent: false, direction: "right" });

            html += `\n\n<span style="color:${fillColor};">●</span> <b>${name}</b>`;
            if (vol != null) { html += `\n  Volumen: ${vol.toFixed(1)} hm³`; if (capacity) html += ` / ${capacity} hm³`; if (pct != null) html += ` (${pct}%)`; }
            if (lvl != null) html += `\n  Nivel: ${lvl.toFixed(1)} m`;
            if (out != null) html += `\n  Desembalse: ${out.toFixed(1)} m³/s`;
            if (t) html += `\n  <span class="r-info">Actualizado: ${t}</span>`;
        }

        addResult(html);
        showProgress(100, "Completado");
        setTimeout(hideProgress, 600);

    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
    finally { hideProgress(); document.getElementById("btn-aforo-embalse").disabled = false; }
}

async function buscarSaihAguasArriba() {
    if (!lastUpstreamFeats || !lastUpstreamFeats.length) return;
    document.getElementById("btn-saih-arriba").disabled = true;
    if (argosLayer) { map.removeLayer(argosLayer); argosLayer = null; }
    lastSaihResults = [];

    addResult(`\n\n<span class="r-label">Buscando estaciones SAIH aguas arriba...</span>`);
    showProgress(0, "Conectando con Argos...");

    try {
        const tk = await argosLogin();
        if (!tk) { addResult(`\n<span style="color:#ff6b6b;">Error: no se pudo conectar con Argos</span>`); return; }

        showProgress(10, "Calculando bbox aguas arriba...");
        const allBounds = L.latLngBounds([]);
        lastUpstreamFeats.forEach(f => {
            try {
                const coords = f.geometry.type === "LineString" ? f.geometry.coordinates : f.geometry.coordinates.flat();

            } catch {}
        });
        if (!allBounds.isValid()) { addResult(`\n<span class="r-info">No hay geometria aguas arriba.</span>`); return; }

        const pad = 0.05;
        const bboxStr = `${allBounds.getWest()-pad},${allBounds.getSouth()-pad},${allBounds.getEast()+pad},${allBounds.getNorth()+pad}`;

        showProgress(20, "Buscando estaciones...");
        const allGauges = await argosWfs(ARGOS_PF, "river_flow", bboxStr);
        if (!allGauges.length) { addResult(`\n<span class="r-info">No se encontraron estaciones SAIH aguas arriba.</span>`); return; }
        showProgress(30, "Clasificando...");
        const onRiver = filterByProximity(allGauges, lastUpstreamFeats, 2);
        const onIds = new Set(onRiver.map(s => s.properties.id_element));
        const inZone = allGauges.filter(s => !onIds.has(s.properties.id_element));
        argosLayer = L.layerGroup().addTo(map);
        let html = "";
        if (onRiver.length) {
            html += `\n\n<span class="r-label">En el cauce aguas arriba (${onRiver.length}):</span>`;
            for (let i = 0; i < onRiver.length; i++) { showProgress(35 + (i / allGauges.length) * 40, `${onRiver[i].properties.name}...`); html += await renderGauge(onRiver[i], true); }
        }
        if (inZone.length) {
            html += `\n\n<span class="r-label" style="color:#8892b0;">En la zona (${inZone.length}):</span>`;
            for (let i = 0; i < inZone.length; i++) { showProgress(75 + (i / allGauges.length) * 20, `${inZone[i].properties.name}...`); html += await renderGauge(inZone[i], false); }
        }
        if (lastSaihResults.length) html += `\n\n<a href="#" onclick="openSaihDashboard();return false" style="color:#64B5F6;font-size:12px;">Abrir dashboard SAIH en ventana</a>`;

        addResult(html);
        showProgress(100, "Completado");
        setTimeout(hideProgress, 600);

    } catch (e) { addResult(`\n<span style="color:#ff6b6b;">Error: ${e.message}</span>`); }
    finally { hideProgress(); document.getElementById("btn-saih-arriba").disabled = false; }
}

function openSaihDashboard() {
    if (!lastSaihResults.length) return;
    const w = window.open("", "_blank", "width=800,height=600");
    const dk = matchMedia("(prefers-color-scheme:dark)").matches;
    const bg = dk ? "#111" : "#f5f7fa", bg2 = dk ? "#1a1a1a" : "#fff", tx = dk ? "#e2e8f0" : "#1e293b", tx2 = dk ? "#94a3b8" : "#64748b", bd = dk ? "#333" : "#e2e8f0";
    let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dashboard SAIH</title><style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:${bg};color:${tx};padding:20px}
    h1{font-size:18px;margin-bottom:16px;color:${tx}}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .card{background:${bg2};border:1px solid ${bd};border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .card-name{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .card-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid ${bd}}
    .card-row:last-child{border:none}
    .card-label{color:${tx2}}.card-val{font-weight:600}
    .thresh{display:flex;gap:6px;margin-top:6px;font-size:11px;color:${tx2}}
    .thresh span{display:flex;align-items:center;gap:3px}
    .thresh-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .alert-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
    th{background:${dk?"#222":"#e8e8e8"};padding:8px 6px;text-align:center;font-weight:600;position:sticky;top:0}
    td{padding:7px 6px;text-align:center;border-bottom:1px solid ${bd}}
    </style></head><body>
    <h1>Dashboard Estaciones SAIH (${lastSaihResults.length})</h1>
    <table><tr><th>Estacion</th><th>Caudal (m³/s)</th><th>Nivel (m)</th><th>Estado</th><th>Hora</th></tr>`;
    lastSaihResults.forEach(r => {
        const alert = r.alertLevel ? `<span class="alert-tag" style="background:${r.alertColor}">${r.alertLevel.replace(" ⚠ ","")}</span>` : `<span style="color:#4CAF50">Normal</span>`;
        html += `<tr><td style="text-align:left;font-weight:600">${r.name}</td><td>${r.flow != null ? r.flow.toFixed(2) : "-"}</td><td>${r.level != null ? r.level.toFixed(2) : "-"}</td><td>${alert}</td><td style="color:${tx2}">${r.time}</td></tr>`;
    });
    html += `</table><div class="cards">`;
    lastSaihResults.forEach(r => {
        html += `<div class="card"><div class="card-name"><div class="dot" style="background:${r.alertColor}"></div>${r.name}`;
        if (r.alertLevel) html += ` <span class="alert-tag" style="background:${r.alertColor}">${r.alertLevel.replace(" ⚠ ","")}</span>`;
        html += `</div>`;
        if (r.flow != null) html += `<div class="card-row"><span class="card-label">Caudal</span><span class="card-val">${r.flow.toFixed(2)} m³/s</span></div>`;
        if (r.level != null) html += `<div class="card-row"><span class="card-label">Nivel</span><span class="card-val">${r.level.toFixed(2)} m</span></div>`;
        if (r.time) html += `<div class="card-row"><span class="card-label">Actualizado</span><span class="card-val">${r.time}</span></div>`;
        if (r.thresholds?.length) {
            html += `<div class="thresh">`;
            r.thresholds.forEach(t => { html += `<span><span class="thresh-dot" style="background:${t.color}"></span>${t.conditionSymbol}${t.value}m</span>`; });
            html += `</div>`;
        }
        html += `</div>`;
    });
    html += `</div></body></html>`;
    w.document.write(html);
    w.document.close();
}

function filterByProximity(stations, lineFeatures, maxKm) {
    if (!lineFeatures.length) return stations;
    const thresh = maxKm / 111.32;
    const allVerts = [];
    lineFeatures.forEach(f => {
        try {
            const c = f.geometry.type === "MultiLineString" ? f.geometry.coordinates.flat() : f.geometry.coordinates;
            for (let i = 0; i < c.length; i += 5) allVerts.push(c[i]);
            allVerts.push(c[c.length - 1]);
        } catch {}
    });
    if (!allVerts.length) return stations;
    return stations.filter(st => {
        const [sx, sy] = st.geometry.coordinates;
        for (const v of allVerts) {
            const dx = v[0] - sx, dy = v[1] - sy;
            if (dx * dx + dy * dy <= thresh * thresh) return true;
        }
        return false;
    });
}
